    <div class="np-horo-hd"><div class="t">The Stars</div><div class="by"><b>As read by Madame Waivera</b>Your sign is set by how you manage, not when you were born.</div></div>
    <div class="np-horo">${E.horo.items.map(h=>`<div class="np-hs"><div class="g">${h.g}&#xFE0E;</div><div class="sg">${esc(h.sign)}<span>${esc(h.why)}</span></div><div class="tm">${esc(h.team)}</div><div class="tx">${esc(h.jab)}</div><div class="tx pr"><b>Prophecy</b>${esc(h.pro)}</div><div class="lk">${esc(h.luck)}</div></div>`).join("")}</div>
    <div class="np-foot">Madame Waivera is not a licensed astrologer, fantasy analyst, or waiver priority. Start your players at your own risk.</div>
  </div></div>` : "";
  const PX = M.playoff, PW = E.po;
  const poPg = poPage ? `<div class="np-page"><div class="np-in np-po po">${run(poPage,"The Playoff Picture")}
    <div class="np-horo-hd"><div class="t">The Race</div><div class="by"><b>Analysis by Dr. Seedwell, Bracketologist</b>${esc(poSub(PX).toLowerCase().replace(/^./,c=>c.toUpperCase()))}</div></div>
    <div class="np-po-br po-br" style="--rounds:${PX.rounds}">${poBracket(PX, PW.champ)}</div>
    <div class="np-po-2"><div>${poOdds(PX)}</div><div><div class="np-sec">Bubble Watch</div>${poBubble(PX)}<div class="np-sec">Clinch Watch</div>${poClinch(PW)}</div></div>
    <div class="po-take"><span class="np-kick">Bracketology</span><h2>${esc(PW.headline)}</h2><div class="body">${PW.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>${PW.byeNote?`<p class="po-note">${esc(PW.byeNote)}</p>`:""}</div>
  </div></div>` : "";
  return [front, ...gamePages, ...(poPg ? [poPg] : []), ...(horoPg ? [horoPg] : []), back];
}

function npFit(page){
  const inner = page.firstElementChild;
  const set = v => page.style.setProperty("--fs", v+"px");
  const fits = () => inner.scrollHeight <= NP_H;
  const mast = page.querySelector(".np-mast");
  if (mast) { let s = 118; mast.style.fontSize = s+"px"; while (mast.scrollWidth > mast.parentElement.clientWidth && s > 44) { s -= 3; mast.style.fontSize = s+"px"; } }
  const h1 = page.querySelector(".np-h1");
  if (h1) { let s = 84; h1.style.fontSize = s+"px"; while (h1.scrollHeight > 300 && s > 40) { s -= 3; h1.style.fontSize = s+"px"; } }
  let lo = 8, hi = 21;
  for (let k=0; k<10; k++) { const mid = (lo+hi)/2; set(mid); if (fits()) lo = mid; else hi = mid; }
  set(Math.floor(lo*4)/4);
}

async function renderPaper(onlyFront){
  await Promise.all([loadScript(LIBS.h2c), onlyFront ? null : loadScript(LIBS.pdf)]);
  try { await document.fonts.ready; } catch(e){}
  const host = document.createElement("div");
  host.className = "np-host";
  host.innerHTML = npHTML(state.model, state.edition).slice(0, onlyFront ? 1 : undefined).join("");
  document.body.appendChild(host);
  try {
    const pages = [...host.querySelectorAll(".np-page")];
    pages.forEach(npFit);
    const canvases = [];
    for (let i=0;i<pages.length;i++) {
      setStatus(`Printing page ${i+1} of ${pages.length}…`);
      canvases.push(await window.html2canvas(pages[i], {scale:2, backgroundColor:"#f3efe4", width:NP_W, height:NP_H, windowWidth:NP_W, logging:false, useCORS:true}));
    }
    return canvases;
  } finally { host.remove(); }
}

function slug(s){ return String(s).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "gazette"; }
async function deliverFile(blob, filename){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dl) { await dl.save({filename, data:blob}); return "saved"; }
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return "shared"; } catch(e){ if (e && e.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return "saved";
}
async function downloadPaper(kind){
  const M = state.model; if (!M || !M.played) { setStatus("Nothing to print yet. Pick a week with scores.", true); return; }
  const btns = [$("#dlPdf"), $("#dlImg"), $("#dl")]; btns.forEach(b=>b.disabled=true);
  setStatus("Warming up the presses…");
  try {
    const canvases = await renderPaper(kind === "img");
    const base = `${slug(gazetteName(M))}-week-${M.week}`;
    let res;
    if (kind === "img") {
      const blob = await new Promise(r=>canvases[0].toBlob(r, "image/png"));
      res = await deliverFile(blob, `${base}-front-page.png`);
    } else {
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({orientation:"portrait", unit:"pt", format:"letter"});
      canvases.forEach((c,i)=>{ if (i) doc.addPage("letter","portrait"); doc.addImage(c.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 612, 792); });
      res = await deliverFile(doc.output("blob"), `${base}.pdf`);
    }
    setStatus(res === "cancelled" ? "" : "Hot off the press. Send it to the league.");
    $("#dlMenu").hidden = true; $("#dl").setAttribute("aria-expanded","false");
  } catch(e) {
    setStatus(e && e.code === "declined" ? "Download cancelled." : ("The press jammed: " + ((e && e.message) || "unknown error")), e && e.code !== "declined");
  } finally { btns.forEach(b=>b.disabled=false); }
}

/* ---------------- Sample league ---------------- */
function sampleRaw(){
  const r = rng(20260928);
  const T = [["Touchdown Tacos","tacotuesday"],["Fumble Factory","butterfingers"],["Waiver Wire Wizards","wirewizard"],["The Bye Week Blues","byeweekbob"],["Kicker Kingdom","footonly"],["Red Zone Rascals","redzoneron"],["Hail Mary Hooligans","hailmaryhank"],["Garbage Time Legends","garbagetime"],["Sunday Scaries","scaredysam"],["Pick Six Posse","picksixpat"]];
  const FIRST = ["Jalen","Marcus","Tre","Darius","Cole","Bryce","Malik","Devon","Isaiah","Caleb","Nico","Jaylen","Rashad","Tyler","Brock","Keenan","Amari","Drake","Quincy","Zay","Terrell","Omar","Luke","Dante","Kyler","Evan","Josh","Rico","Bo","Xavier"];
  const LAST = ["Holloway","Brightwater","Kingsley","Okafor","Maddox","Pruitt","Whitlock","Sandoval","Achebe","Lindqvist","Fairbanks","Culpepper","Dunmore","Ravenel","Tolliver","Mercer","Beaumont","Quarles","Stroud-Ellis","Vance","Hargrove","Oduya","Pembroke","Castellanos","Winslow","Ashby","Delacroix","Farrow","Gentry","Ibarra","Kessler","Montague","Northcutt","Pasternak","Redwine","Salcedo","Thornbury","Underwood","Valdez","Yardley"];
  const NFL = ["BUF","MIA","NYJ","NE","BAL","CIN","CLE","PIT","HOU","IND","JAX","TEN","DEN","KC","LV","LAC","DAL","NYG","PHI","WAS","CHI","DET","GB","MIN","ATL","CAR","NO","TB","ARI","LAR","SF","SEA"];
  const DEFN = {BUF:"Buffalo Bills",MIA:"Miami Dolphins",NYJ:"New York Jets",NE:"New England Patriots",BAL:"Baltimore Ravens",CIN:"Cincinnati Bengals",CLE:"Cleveland Browns",PIT:"Pittsburgh Steelers",HOU:"Houston Texans",IND:"Indianapolis Colts"};
  const players = {}, base = {}; let pid = 1;
  const used = new Set();
  const MEAN = {QB:[12,22],RB:[5,16],WR:[5,16],TE:[4,11],K:[7,9],DEF:[5,8]};
  const mk = pos => { let nm; do { nm = pick(r,FIRST)+" "+pick(r,LAST); } while (used.has(nm)); used.add(nm); const id="s"+(pid++); players[id]=[nm,pos,pick(r,NFL),""]; const [a,b]=MEAN[pos]; base[id]=a+(b-a)*r(); return id; };
  const defs = Object.keys(DEFN);
  const rosterPositions = ["QB","RB","RB","WR","WR","TE","FLEX","K","DEF","BN","BN","BN","BN","BN"];
  const users = [], rosters = [], L = {};
  T.forEach(([team,mgr],i) => {
    users.push({user_id:"u"+i, display_name:mgr, metadata:{team_name:team}});
    rosters.push({roster_id:i+1, owner_id:"u"+i});
    const d = defs[i]; players[d] = [DEFN[d],"DEF",d,""]; base[d] = 5+3*r();
    L[i+1] = {QB:[mk("QB"),mk("QB")], RB:[mk("RB"),mk("RB"),mk("RB"),mk("RB")], WR:[mk("WR"),mk("WR"),mk("WR"),mk("WR")], TE:[mk("TE"),mk("TE")], K:[mk("K")], DEF:[d]};
  });
  // A few storylines to exercise the engine: a Week 2 trade (so a revenge game can happen), waiver pickups, an injury, an empty slot
  const tradeA = L[3].WR[0], tradeB = L[7].RB[0];
  const pickupRB = mk("RB"), pickupWR = mk("WR");
  base[pickupRB] = 15; base[pickupWR] = 13;
  const hurt = L[2].RB[0]; players[hurt][3] = "Out";
  const txnsByWeek = {
    1: [{status:"complete", type:"waiver", adds:{[pickupWR]:9}, drops:{[L[9].WR[3]]:9}, settings:{waiver_bid:12}}],
    2: [{status:"complete", type:"trade", adds:{[tradeA]:7, [tradeB]:3}, drops:{[tradeA]:3, [tradeB]:7}, settings:{}},
        {status:"complete", type:"waiver", adds:{[pickupRB]:5}, drops:{[L[5].RB[3]]:5}, settings:{waiver_bid:37}}],
    3: [{status:"complete", type:"free_agent", adds:{[mk("K")]:2}, drops:{}, settings:{}}]
  };
  const n = 10, ids = [...Array(n)].map((_,i)=>i+1), weeks = {}, proj = {};
  const BYE_OF = Object.fromEntries(NFL.map((t,i)=>[t, 5 + (i % 10)]));   // a full season of NFL bye weeks (Weeks 5-14)
  const onBye = (id, w) => BYE_OF[players[id][2]] === w;
  for (let w=1; w<=14; w++) {
    if (w===2) { L[3].WR[0] = tradeB; L[7].RB[0] = tradeA; L[5].RB[3] = pickupRB; L[9].WR[3] = pickupWR; }
    if (w===3) { L[9].WR[3] = pickupWR; }
    proj[w] = {};
    const rot = [ids[0], ...ids.slice(1).map((_,k,arr)=>arr[(k+w-1)%arr.length])];
    const list = [];
    for (let k=0;k<n/2;k++) {
      for (const rid of [rot[k], rot[n-1-k]]) {
        const R = L[rid], all = [...R.QB,...R.RB,...R.WR,...R.TE,...R.K,...R.DEF];
        const pp = {};
        for (const id of all) {
          const pj = Math.round(base[id]*(0.85+0.3*r())*100)/100;
          if (!onBye(id, w)) proj[w][id] = pj;
          let v = pj * (0.1 + 1.9*Math.pow(r(), 1.1)) + (players[id][1]==="DEF" ? -3 + 4*r() : 0);
          if (id === hurt && w === 3) v = 1.4;
          pp[id] = onBye(id, w) ? 0 : Math.round(v*100)/100;
        }
        const flexPick = r()<.5 ? R.RB[2] : R.WR[2];
        let starters = [R.QB[0],R.RB[0],R.RB[1],R.WR[0],R.WR[1],R.TE[0],flexPick,R.K[0],R.DEF[0]];
        // sample managers swap out players on bye when they have a backup at the position
        const backups = {QB:[...R.QB], RB:[...R.RB], WR:[...R.WR], TE:[...R.TE]};
        starters = starters.map(id => { if (!onBye(id, w)) return id; const pos = players[id][1]; const alt = (backups[pos]||[]).find(b=>b!==id && !starters.includes(b) && !onBye(b, w)); return alt || id; });
        if (w===2 && rid===8) starters[5] = "0";
        const sp = starters.map(id=>id==="0"?0:pp[id]);
        list.push({roster_id:rid, matchup_id:k+1, starters, starters_points:sp, players:all, players_points:pp, points:Math.round(sp.reduce((a,b)=>a+b,0)*100)/100});
      }
    }
    weeks[w] = list;
  }
  for (const ro of rosters) { const R = L[ro.roster_id]; ro.players = [...R.QB,...R.RB,...R.WR,...R.TE,...R.K,...R.DEF]; ro.starters = [R.QB[0],R.RB[0],R.RB[1],R.WR[0],R.WR[1],R.TE[0],R.RB[2],R.K[0],R.DEF[0]]; }
  const byeWeeks = {}; for (let w=1; w<=14; w++) { const b = NFL.filter(t=>BYE_OF[t]===w); if (b.length) byeWeeks[w] = b; }
  return {league:{league_id:"sample", name:"The Sample League", season:"2026", roster_positions:rosterPositions, scoring_settings:{rec:1}, settings:{playoff_week_start:15, playoff_teams:6, league_average_match:1}}, users, rosters, weeks, txnsByWeek, proj, players, byeWeeks};
}

/* ---------------- App state + wiring ---------------- */
const state = {model:null, edition:null, sample:true, early:false, raw:null, leagueId:null, nflState:null};
function setStatus(msg, err){ const s=$("#status"); s.textContent = msg||""; s.classList.toggle("err", !!err); }
const wkSel = $("#wk");
for (let w=1; w<=18; w++) wkSel.add(new Option("Week "+w, w));

function defaultWeek(ns){
  if (!ns) return 3;
  const cur = +ns.week || 1, day = new Date().getDay(); // 0 Sun … 6 Sat
  if (ns.season_type !== "regular" && ns.season_type !== "post") return Math.max(1, Math.min(18, cur||1));
  return Math.max(1, Math.min(18, (day===1||day===2) ? cur : cur-1));
}

const SITE = "https://waiverwiregazette.com";
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function editionDate(){
  const m = state.pinDate && /^(\d{4})-(\d{2})-(\d{2})$/.exec(state.pinDate);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date();
}
// A shared edition's settings (rewrite version, print date) only apply until the reader changes something
function clearShared(){
  state.pinDate = null;
  try { if (location.search) history.replaceState(null, "", location.pathname); } catch(e){}
}
function show(raw, week, isSample, variant = 0){
  state.raw = raw; state.sample = isSample;
  const ns0 = state.nflState;
  state.model = buildModel(raw, week, {injFresh: isSample || !ns0 || week >= +ns0.week - 1});
  state.edition = writeEdition(state.model, variant);
  state.variant = variant; state.week = week;
  $("#share").hidden = isSample;
  const ns = state.nflState, day = new Date().getDay();
  state.early = !isSample && ns && +ns.week === week && (day===0 || day===1);
  render();
}

async function loadLeague(id, week, variant = 0){
  $("#go").disabled = true;
  try {
    const raw = await fetchLeagueRaw(id, week, m=>setStatus(m));
    state.leagueId = id;
    show(raw, week, false, variant);
    setStatus(`Week ${week} edition of ${raw.league.name} is on the stands.`);
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { $("#go").disabled = false; }
}

async function resolveInput(){
  const q = $("#q").value.trim();
  const week = +wkSel.value;
  if (!q) { setStatus("Enter a Sleeper username or league ID.", true); return; }
  if (/^\d{9,}$/.test(q)) { $("#lgWrap").hidden = true; state.pickerFor = null; return loadLeague(q, week); }
  $("#lgWrap").hidden = true; state.pickerFor = null;
  $("#go").disabled = true;
  try {
    setStatus(`Looking up @${q}…`);
    const user = await getJSON(`/user/${encodeURIComponent(q)}`);
    if (!user || !user.user_id) throw new Error(`No Sleeper user named “${q}”. Check the spelling, or paste a league ID instead.`);
    const season = (state.nflState && state.nflState.season) || String(new Date().getFullYear());
    let leagues = await getJSON(`/user/${user.user_id}/leagues/nfl/${season}`) || [];
    if (!leagues.length) throw new Error(`@${q} has no ${season} NFL leagues on Sleeper.`);
    const sel = $("#lg"); sel.innerHTML = "";
    leagues.forEach(l=>sel.add(new Option(l.name, l.league_id)));
    $("#lgWrap").hidden = leagues.length < 2;
    state.pickerFor = q.toLowerCase();
    $("#go").disabled = false;
    return loadLeague(leagues[0].league_id, week);
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { $("#go").disabled = false; }
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  clearShared();
  if (state.sample && !$("#q").value.trim()) { show(state.raw, Math.min(14, +wkSel.value), true); setStatus(+wkSel.value > 14 ? "The sample league's regular season ends in Week 14. Showing Week 14." : `Showing the sample league, Week ${Math.min(14, +wkSel.value)}. Enter your username or league ID to print yours.`); return; }
  if (!$("#lgWrap").hidden && state.pickerFor && $("#q").value.trim().toLowerCase() === state.pickerFor && $("#lg").value) return loadLeague($("#lg").value, +wkSel.value);
  resolveInput();
});
$("#lg").addEventListener("change", () => { clearShared(); loadLeague($("#lg").value, +wkSel.value); });
$("#regen").addEventListener("click", () => {
  clearShared();
  const v = (state.variant || 0) + 1;
  if (state.sample || !state.leagueId) { show(state.raw, state.week || 3, true, v); setStatus("Rewritten. Same scores, fresh copy."); return; }
  try { localStorage.removeItem("wwg_players_v3"); } catch(e){}
  loadLeague(state.leagueId, +wkSel.value, v).then(()=>{ if (!$("#status").classList.contains("err")) setStatus(`Refreshed with the latest scores and rewritten. Week ${wkSel.value}.`); });
});
$("#share").addEventListener("click", async () => {
  if (state.sample || !state.leagueId || !state.model) return;
  const q = new URLSearchParams({league: state.leagueId, v: String(state.variant || 0), d: state.pinDate || isoDay(new Date())});
  const url = `${SITE}/w/${state.week}/?${q.toString()}`;
  const text = `The Week ${state.week} edition of ${gazetteName(state.model)} is on the stands.`;
  if (navigator.share) {
    try { await navigator.share({title: `Week ${state.week} Recap`, text, url}); setStatus("Shared."); return; }
    catch(e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); setStatus("Link copied. Paste it anywhere. It opens straight to this edition."); }
  catch(e) { setStatus("Here's your link: " + url); }
});
$("#dl").addEventListener("click", () => { const m=$("#dlMenu"); m.hidden=!m.hidden; $("#dl").setAttribute("aria-expanded", String(!m.hidden)); });
$("#dlPdf").addEventListener("click", () => downloadPaper("pdf"));
$("#dlImg").addEventListener("click", () => downloadPaper("img"));

// Boot: sample edition first, then look for live context
show(sampleRaw(), 3, true);
wkSel.value = "3";
(async () => {
  try {
    state.nflState = await getJSON("/state/nfl");
    wkSel.value = String(defaultWeek(state.nflState));
    let params = null; try { params = new URL(location.href).searchParams; } catch(e){}
    const lid = params && params.get("league"), w = params && +params.get("week");
    const v = params && Math.max(0, parseInt(params.get("v") || "0", 10) || 0), d = params && params.get("d");
    if (w >= 1 && w <= 18) wkSel.value = String(w);
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) state.pinDate = d;
    if (lid) { $("#q").value = lid; loadLeague(lid, +wkSel.value, v); }
    else setStatus("Live Sleeper data connected. Enter your username or league ID.");
  } catch(e) {
    setStatus("Showing a sample league. Live Sleeper data loads in the hosted version of this app.");
  }
})();
})();
</script>
