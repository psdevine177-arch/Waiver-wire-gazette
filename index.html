<style>
/* Layout: a dark "press room" control strip over a single tabloid front page — lead story + right rail, then game summaries, wire, power poll. Single deliberate newsprint look. */
:root{
  --desk:#2a2a2c; --press:#161617; --press-fg:#e9e7df; --press-muted:#9c9a92;
  --paper:#efeee8; --ink:#141414; --muted:#56544e; --tint:#e1dfd6; --red:#c3161c; --red-ink:#fff; --green:#1f6b3a; --green2:#3e6b50; --amber:#8a6a00; --gray:#6b6860;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Press room */
.press{background:var(--press);color:var(--press-fg);padding-inline:16px;padding-block:14px;border-bottom:4px solid var(--red)}
.press-in{max-width:1180px;margin:0 auto;display:grid;gap:10px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .bl{font-family:"Manufacturing Consent","Old English Text MT",Georgia,serif;font-weight:400;text-transform:none;letter-spacing:0;font-size:28px}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;color:var(--press-muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--press-muted)}
.fld input,.fld select,.fld textarea{background:#232325;color:var(--press-fg);border:1px solid #3c3c3f;border-radius:3px;padding:9px 10px;min-width:0}
.fld textarea{min-height:84px;resize:vertical;width:100%}
#q{width:min(320px,80vw)}
#lg{max-width:min(320px,80vw)}
.btn{background:#2d2d30;color:var(--press-fg);border:1px solid #47474b;border-radius:3px;padding:9px 13px;cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.btn:hover{background:#38383c}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
#status{font-family:var(--mono);font-size:12px;color:var(--press-muted);min-height:1.2em}
#status.err{color:#ff8a80}
.settings{border-top:1px solid #333;padding-top:10px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.settings p{margin:0;font-size:12.5px;color:var(--press-muted);font-family:var(--mono);line-height:1.5}

/* Paper */
.desk{padding-inline:16px;padding-block:22px 48px}
.paper{max-width:1180px;margin:0 auto;background:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.45);padding:clamp(14px,3vw,34px)}
.banner{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:8px 12px;margin-bottom:14px}
.banner b{color:#ff6b62}

.flag{border-bottom:6px double var(--ink);padding-bottom:10px;display:grid;gap:6px}
.flag-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:6px}
.masthead{font-family:"Manufacturing Consent","Old English Text MT",Georgia,serif;font-weight:400;line-height:1.08;font-size:clamp(38px,7.4vw,96px);text-align:center;text-wrap:balance;margin:8px 0 4px}
.flag-sub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;align-items:center}
.flag-sub .ed{background:var(--red);color:var(--red-ink);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px}
.flag-sub .tag{font-style:italic;color:var(--muted)}

/* Ticker */
.ticker{display:flex;gap:0;overflow-x:auto;border-bottom:3px solid var(--ink);margin-bottom:18px;scrollbar-width:thin}
.tk{flex:0 0 auto;padding:8px 14px;border-right:1px solid #bdbab0;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:grid;gap:2px;min-width:190px}
.tk .fin{font-size:10px;letter-spacing:.14em;color:var(--red);font-weight:600}
.tk .ln{display:flex;justify-content:space-between;gap:10px}
.tk .ln span:first-child{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .w{font-weight:600}

.bigscore{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;border:3px solid var(--ink);margin-bottom:16px;position:relative;overflow:hidden}

.cols{columns:2 280px;column-gap:26px;column-rule:1px solid #bdbab0}

.lead .next{font-family:var(--mono);font-size:12px;border-top:1px solid var(--ink);padding-top:8px;margin-top:6px}

/* Rail */
.rail{display:grid;gap:22px;align-content:start;min-width:0}

.award{display:grid;gap:1px;padding:8px 0;border-bottom:1px solid #bdbab0}
.award .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}

table.stand{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}

.paper{position:relative}
.flag{position:relative}
.fx-stamp{position:absolute;z-index:3;right:0;top:40%;font-family:var(--display);font-weight:900;color:var(--red);border:3px solid var(--red);padding:.14em .45em .04em;letter-spacing:.04em;line-height:1;font-size:clamp(15px,1.8vw,21px);transform:rotate(-12deg);background:rgba(239,238,232,.45);mix-blend-mode:multiply;pointer-events:none;white-space:nowrap}

.fx-ch,.fx-w{display:inline-block}

.fx-stamp.two{text-align:center;line-height:.95;white-space:normal}

.bno{position:absolute;right:calc(var(--bs,24px)*-.18);bottom:calc(var(--bs,24px)*-.14);min-width:calc(var(--bs,24px)*.56);height:calc(var(--bs,24px)*.56);padding:0 2px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 calc(var(--bs,24px)*.36)/calc(var(--bs,24px)*.56) var(--mono);font-style:normal;text-align:center;box-shadow:0 0 0 1.5px var(--paper);box-sizing:border-box}

.mkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,42%),1fr));gap:8px 16px;padding:4px 16px 16px 34px;font-size:13.5px;font-weight:600}

.ml{position:absolute;transform:translate(0,-50%);margin-left:10px;font-family:var(--body);font-weight:600;font-size:clamp(11px,1.3vw,13.5px);white-space:nowrap;z-index:1;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper);pointer-events:none}

<script>
(() => {
"use strict";
const API = "https://api.sleeper.app/v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2 = n => (Math.round((+n||0)*100)/100).toFixed(2);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function hash(s){ let h=2166136261; for (const c of String(s)) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }

const pick = (r,arr) => arr[Math.floor(r()*arr.length)];
const ord = n => n + (["th","st","nd","rd"][((n%100)-20)%10] || ["th","st","nd","rd"][n%100] || "th");
const lastName = n => { const parts=String(n||"").split(" ").filter(p=>!/^(jr\.?|sr\.?|ii|iii|iv|v)$/i.test(p)); return parts[parts.length-1] || n; };
const recStr = r => r ? `${r.w}-${r.l}${r.t?"-"+r.t:""}` : "0-0";
const ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],FLEX:["RB","WR","TE"],WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],DL:["DL","DE","DT"],LB:["LB"],DB:["DB","CB","S"],IDP_FLEX:["DL","DE","DT","LB","DB","CB","S"]};
const STAFF = ["Chip Waverly, Senior Gridiron Correspondent","Dot Halloran, Waiver Wire Bureau","Rex Pemberton III, Chief Hot Take Officer","Marge Kowalski, Lineup Desk","Buzz Ferrante, Late Window Reporter","Tip O'Rourke, Box Score Beat"];

/* ---------------- Sleeper data ---------------- */
async function getJSON(path, base){
  let r;
  try { r = await fetch((base || API) + path); }
  catch(e){ const err = new Error("network"); err.network = true; throw err; }
  if (!r.ok) throw new Error(`Sleeper returned ${r.status} for ${path}`);
  return r.json();
}
async function loadPlayers(){
  const cached = store.get("wwg_players_v3");
  if (cached) { try { const o = JSON.parse(cached); if (Date.now()-o.t < 864e5) return o.p; } catch(e){} }
  const raw = await getJSON("/players/nfl");
  const p = {};
  for (const [id,v] of Object.entries(raw||{})) {
    if (!v) continue;
    const name = v.full_name || [v.first_name,v.last_name].filter(Boolean).join(" ");
    p[id] = [name, v.position || (v.fantasy_positions||[])[0] || "", v.team || "", v.injury_status || "", v.years_exp ?? null];
  }
  store.set("wwg_players_v3", JSON.stringify({t:Date.now(), p}));
  return p;
}
function projKey(league){
  const rec = league.scoring_settings && league.scoring_settings.rec != null ? +league.scoring_settings.rec : 1;
  return rec >= 1 ? "pts_ppr" : rec >= 0.5 ? "pts_half_ppr" : "pts_std";
}
// Unofficial Sleeper projections feed. If it ever breaks, projection-based stories quietly drop out.
async function loadProjections(season, week, key){
  const pos = ["QB","RB","WR","TE","K","DEF"].map(p=>"position[]="+p).join("&");
  const data = await getJSON(`/projections/nfl/${season}/${week}?season_type=regular&${pos}`, "https://api.sleeper.app");
  const rows = Array.isArray(data) ? data : Object.entries(data||{}).map(([player_id,stats])=>({player_id, stats}));
  const out = {};
  for (const row of rows) {
    const s = row && row.stats || {};
    const v = s[key] ?? s.pts_ppr ?? s.pts_half_ppr ?? s.pts_std;
    if (row && row.player_id != null && v != null && isFinite(+v)) out[row.player_id] = +v;
  }
  if (!Object.keys(out).length) throw new Error("no projections");
  return out;
}
// Which NFL teams are on bye in a given week: every team defense gets a projection unless its team isn't playing.
// Tiny request (32 rows). Returns null if the answer doesn't look sane, so a bad feed never prints wrong byes.
const NFL32 = ["ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN","DET","GB","HOU","IND","JAX","KC","LV","LAC","LAR","MIA","MIN","NE","NO","NYG","NYJ","PHI","PIT","SF","SEA","TB","TEN","WAS"];
async function loadByes(season, week){
  const data = await getJSON(`/projections/nfl/${season}/${week}?season_type=regular&position[]=DEF`, "https://api.sleeper.app");
  const rows = Array.isArray(data) ? data : Object.entries(data||{}).map(([player_id,stats])=>({player_id, stats}));
  const playing = new Set();
  for (const r of rows) { const t = (r && (r.team || (r.player && r.player.team) || r.player_id)) || ""; if (NFL32.includes(String(t))) playing.add(String(t)); }
  const byes = NFL32.filter(t=>!playing.has(t));
  return playing.size >= 24 && byes.length <= 8 ? byes : null;
}
// Draft edition data: the league's draft, every pick, season-long projections with ADP, and the full bye schedule
const hasIDP = league => (league.roster_positions||[]).some(s=>["DL","LB","DB","IDP_FLEX","DE","DT","CB","S"].includes(s));
const isSuperflex = league => { const rp = league.roster_positions||[]; return rp.includes("SUPER_FLEX") || rp.filter(s=>s==="QB").length >= 2; };
function adpKeys(league){
  const rec = league.scoring_settings && league.scoring_settings.rec != null ? +league.scoring_settings.rec : 1;
  const fmt = rec >= 1 ? "ppr" : rec >= 0.5 ? "half_ppr" : "std";
  const dyn = league.settings && +league.settings.type === 2, sf = isSuperflex(league), idp = hasIDP(league);
  return [...(dyn ? [sf ? "adp_dynasty_2qb" : null, `adp_dynasty_${fmt}`, "adp_dynasty"] : []), sf ? "adp_2qb" : null, idp ? (sf ? "adp_idp" : "adp_idp_1qb") : null, `adp_${fmt}`, "adp_ppr", "adp_half_ppr", "adp_std"].filter(Boolean);
}
async function loadSeasonProjections(league){
  const posList = ["QB","RB","WR","TE","K","DEF", ...(hasIDP(league) ? ["DL","LB","DB"] : [])];
  const data = await getJSON(`/projections/nfl/${league.season}?season_type=regular&${posList.map(p=>"position[]="+p).join("&")}`, "https://api.sleeper.app");
  const rows = Array.isArray(data) ? data : Object.entries(data||{}).map(([player_id,stats])=>({player_id, stats}));
  const key = projKey(league), keys = adpKeys(league), out = {};
  // one ADP list for the whole league (mixing a 1QB list into a superflex one misjudges quarterbacks)
  const okAdp = v => isFinite(v) && v > 0 && v < 999;
  const cover = k => rows.filter(r0 => r0 && r0.stats && okAdp(+r0.stats[k])).length;
  const adpKey = keys.find(k => cover(k) >= 60) || keys.find(k => cover(k) > 0) || null;
  // the league's own scoring applied to projected stats (6-point passing TDs, TE premium, first downs...)
  const ss = league.scoring_settings || {}, OFF = ["QB","RB","WR","TE"];
  const own = (st, pos) => { if (!OFF.includes(pos) || !["pass_yd","rush_yd","rec_yd","rec"].some(k => st[k] != null)) return null;
    let t = 0; for (const [k, v] of Object.entries(st)) { const m = +ss[k]; if (m && isFinite(+v) && !/^(adp_|pts_|gp$|gs$|cmp_pct)/.test(k)) t += m * +v; }
    const b = +ss["bonus_rec_" + pos.toLowerCase()]; if (b && st.rec) t += b * +st.rec;
    return t; };
  const cand = [];
  for (const row of rows) {
    if (!row || row.player_id == null) continue;
    const s = row.stats || {}, pos = normPos((row.player && row.player.position) || row.position || "");
    const pts = s[key] ?? s.pts_ppr ?? s.pts_half_ppr ?? s.pts_std;
    const adp = adpKey && okAdp(+s[adpKey]) ? +s[adpKey] : null;
    const mine = own(s, pos);
    if (mine != null && pts != null && +pts > 50) cand.push(mine / +pts);
    if ((pts != null && isFinite(+pts)) || adp != null || mine != null) out[row.player_id] = {pts: pts != null && isFinite(+pts) ? +pts : null, adp, own: mine};

  const med = cand.length >= 20 ? [...cand].sort((a,b) => a-b)[Math.floor(cand.length/2)] : 0, custom = med > .6 && med < 1.8;

  Object.defineProperty(out, "_meta", {value: {adpKey, custom}, enumerable: false});
  return out;
}
async function fetchDraftRaw(league, status){
  status("Pulling the draft board…");
  const drafts = (await getJSON(`/league/${league.league_id}/drafts`).catch(()=>[])) || [];
  const mine = drafts.filter(d => d && String(d.season || league.season) === String(league.season));
  const done = mine.filter(d => d.status === "complete").sort((a,b)=>(+b.last_picked||+b.start_time||0)-(+a.last_picked||+a.start_time||0));
  let draft = done[0] || mine[0] || null, picks = [];
  if (draft && draft.status === "complete") {
    const [full, pk] = await Promise.all([getJSON(`/draft/${draft.draft_id}`).catch(()=>null), getJSON(`/draft/${draft.draft_id}/picks`).catch(()=>[])]);
    if (full) draft = full; picks = pk || [];
  }
  const out = {draft, picks, seasonProj:{}, draftByes:{}};
  if (picks.length) {
    status("Pulling season projections and ADP…");
    try { out.seasonProj = await loadSeasonProjections(league); } catch(e){}
    status("Checking the bye-week schedule…");
    const regLast = Math.min(17, ((league.settings && +league.settings.playoff_week_start) || 15) - 1);
    await Promise.all(Array.from({length:regLast},(_,i)=>i+1).map(async w => { try { const b = await loadByes(league.season, w); if (b && b.length) out.draftByes[w] = b; } catch(e){} }));
  }
  return out;
}
async function fetchLeagueRaw(id, week, status){
  status(`Pulling league ${id}…`);
  const [league, users, rosters] = await Promise.all([getJSON(`/league/${id}`), getJSON(`/league/${id}/users`), getJSON(`/league/${id}/rosters`)]);
  if (!league) throw new Error(`No Sleeper league found with ID ${id}.`);
  status(week ? `Pulling box scores and transactions through week ${week}…` : "Pulling the schedule…");

  const po = league.settings && +league.settings.playoff_week_start || 0;

  await Promise.all(Array.from({length:upto},(_,i)=>i+1).map(async w => {
    weeks[w] = await getJSON(`/league/${id}/matchups/${w}`).catch(()=>[]);

  }));

  const key = projKey(league), proj = {};
  await Promise.all([week, week-1, week+1].filter(w=>w>=1 && w<=18).map(async w => { try { proj[w] = await loadProjections(league.season, w, key); } catch(e){} }));
  const players = await loadPlayers().catch(()=>({}));
  const byeWeeks = {};
  if (po && week < po - 1 && po - 1 - week <= 6) {
    status("Checking the bye-week schedule…");
    await Promise.all(Array.from({length:po-1-week},(_,i)=>week+1+i).map(async w => { try { const b = await loadByes(league.season, w); if (b) byeWeeks[w] = b; } catch(e){} }));
  }
  const raw = {league, users: users||[], rosters: rosters||[], weeks, txnsByWeek, proj, players, byeWeeks};
  if (week === 0) Object.assign(raw, await fetchDraftRaw(league, status));
  else if (po && week >= po) {
    status("Pulling the playoff bracket…");
    [raw.wb, raw.lb] = await Promise.all([getJSON(`/league/${id}/winners_bracket`).catch(()=>[]), getJSON(`/league/${id}/losers_bracket`).catch(()=>[])]);
    try { const ds = (await getJSON(`/league/${id}/drafts`)) || []; const d = ds.filter(x => x && x.status === "complete" && String(x.season || league.season) === String(league.season))[0];
      if (d) raw.picks = (await getJSON(`/draft/${d.draft_id}/picks`)) || []; } catch(e){}
  }
  return raw;
}

/* ---------------- Model + story angles ---------------- */
const INJURED = new Set(["Out","IR","PUP","Doubtful"]);
function buildModel(raw, week, opts = {}){
  // What ran last week (memoized per data load, so the whole chain back to Week 1 is consistent)
  const memo = raw._memo || (Object.defineProperty(raw, "_memo", {value:{}, enumerable:false}), raw._memo);
  const prevLight = () => memo[week-1] || (memo[week-1] = buildModel(raw, week-1, {light:true}));
  const {league, users, rosters, weeks, players} = raw;
  const txnsByWeek = raw.txnsByWeek || {};
  const proj = (raw.proj || {})[week] || null;
  const userById = Object.fromEntries(users.map(u=>[u.user_id,u]));
  const teams = {};
  for (const r of rosters) {
    const u = userById[r.owner_id] || {};
    teams[r.roster_id] = {rid:r.roster_id, team:(u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, mgr:u.display_name || "an unclaimed roster"};
  }
  const tname = rid => (teams[rid] || {}).team || "?";
  const slots = (league.roster_positions||[]).filter(s=>!["BN","IR","TAXI"].includes(s));
  const bestBall = !!(league.settings && +league.settings.best_ball === 1);   // lineups are auto-set, so no lineup-decision stories
  const notBench = Object.fromEntries(rosters.map(r=>[r.roster_id, new Set([...(r.taxi||[]), ...(r.reserve||[])])]));
  const P = id => {
    const p = players[id];
    if (p) return {name:p[0], pos:p[1], nfl:p[2], inj:p[3] || "", exp:p[4] ?? null};
    const isDef = /^[A-Z]{2,3}$/.test(id);
    return {name: isDef ? `${id} D/ST` : `Player ${id}`, pos: isDef ? "DEF" : "", nfl: isDef ? id : "", inj:""};
  };
  const pairs = w => {
    const by = {};
    for (const m of (weeks[w]||[])) { if (m.matchup_id == null) continue; (by[m.matchup_id] = by[m.matchup_id] || []).push(m); }
    return Object.entries(by).filter(([,a])=>a.length===2).map(([id,a])=>({id:+id, a:a[0], b:a[1]}));
  };
  const po = league.settings && +league.settings.playoff_week_start || 0;
  const medianOn = !!(league.settings && +league.settings.league_average_match === 1);
  const medianFor = w => {
    if (!medianOn || (po && w >= po)) return null;
    const sc = pairs(w).flatMap(g=>[[g.a.roster_id,+g.a.points||0],[g.b.roster_id,+g.b.points||0]]);
    if (!sc.length || sc.every(([,p])=>p===0)) return null;
    const s = sc.map(x=>x[1]).sort((a,b)=>a-b), k = s.length;
    const med = k%2 ? s[(k-1)/2] : (s[k/2-1]+s[k/2])/2;
    const res = {};
    for (const [rid,p] of sc) res[rid] = p>med ? "W" : p<med ? "L" : "T";
    return {med, res};
  };

  // Season-to-date records, scores, margins, standings positions
  const rec = {}, scores = {};
  for (const rid in teams) { rec[rid] = {w:0,l:0,t:0,pf:0,pa:0,res:[]}; scores[rid] = {}; }
  const rankOf = R => Object.fromEntries(Object.keys(teams)
    .sort((a,b)=>(R[b].w+R[b].t/2)-(R[a].w+R[a].t/2) || R[b].pf-R[a].pf).map((rid,i)=>[rid,i+1]));
  const margins = [];
  let before = null, rankBefore = null, seasonHigh = null, seasonLow = null;
  for (let w=1; w<=week; w++) {
    if (w === week) { before = JSON.parse(JSON.stringify(rec)); rankBefore = rankOf(rec); }
    const md = medianFor(w);
    if (md) for (const [rid,x] of Object.entries(md.res)) { const T = rec[rid]; if (!T) continue; if (x==="W") T.w++; else if (x==="L") T.l++; else T.t++; }
    for (const g of pairs(w)) {
      const pa = +g.a.points||0, pb = +g.b.points||0;
      if (pa===0 && pb===0) continue;
      const A = rec[g.a.roster_id], B = rec[g.b.roster_id];
      if (!A || !B) continue;
      scores[g.a.roster_id][w] = pa; scores[g.b.roster_id][w] = pb;
      margins.push(Math.abs(pa-pb));
      for (const [m,rid] of [[pa,g.a.roster_id],[pb,g.b.roster_id]]) {
        if (!seasonHigh || m > seasonHigh.pts) seasonHigh = {pts:m, rid, week:w};
        if (m > 0 && (!seasonLow || m < seasonLow.pts)) seasonLow = {pts:m, rid, week:w};
      }
      if (po && w >= po) continue;   // playoff games don't change regular-season records
      A.pf+=pa; A.pa+=pb; B.pf+=pb; B.pa+=pa;
      if (pa>pb){A.w++;B.l++;A.res.push("W");B.res.push("L");}
      else if (pb>pa){B.w++;A.l++;B.res.push("W");A.res.push("L");}
      else {A.t++;B.t++;A.res.push("T");B.res.push("T");}
    }
  }
  const rankAfter = rankOf(rec);
  const weekMedian = medianFor(week);
  const streakOf = res => { if (!res || !res.length) return {k:"",n:0}; const k = res[res.length-1]; let n=0; for (let i=res.length-1;i>=0&&res[i]===k;i--) n++; return {k,n}; };

  // Who acquired whom, and who used to roster whom (this season)
  const acq = {}, formerOwners = {};
  for (let w=1; w<=week; w++) for (const t of (txnsByWeek[w]||[])) {
    if (t.status !== "complete") continue;
    for (const [pid,rid] of Object.entries(t.drops||{})) (formerOwners[pid] = formerOwners[pid] || {})[rid] = t.type === "trade" ? "trade" : "cut";
    for (const [pid,rid] of Object.entries(t.adds||{})) acq[pid] = {rid:+rid, type:t.type, week:w};
  }

  const detail = m => {
    const pp = m.players_points || {};
    const raw = m.starters || [];
    const emptySlots = raw.filter(id=>!id || id==="0").length;
    const starters = raw.map((id,i)=>({id, slot:slots[i]||"", pts:+((m.starters_points && m.starters_points[i]) ?? pp[id] ?? 0), proj: proj ? (proj[id] ?? null) : null, ...P(id)})).filter(s=>s.id && s.id!=="0");
    const sset = new Set(raw);
    const nb = notBench[m.roster_id] || new Set();
    const bench = (m.players||[]).filter(id=>!sset.has(id) && !nb.has(id)).map(id=>({id, pts:+(pp[id]||0), proj: proj ? (proj[id] ?? null) : null, ...P(id)}));
    let tb = null, hb = null; // true blunder (projections favored the bench guy) / hindsight
    for (const b of bench) for (const s of starters) {
      const el = ELIG[s.slot];
      if (el ? !el.includes(b.pos) : s.pos !== b.pos) continue;
      const gain = b.pts - s.pts;
      if (gain <= 0) continue;
      const edge = (b.proj != null && s.proj != null) ? b.proj - s.proj : null;
      if (edge != null && edge >= 3 && (!tb || gain > tb.gain)) tb = {b, s, gain, edge};
      if (!hb || gain > hb.gain) hb = {b, s, gain, edge};
    }
    if (bestBall) { tb = null; hb = null; }
    const sorted = [...starters].sort((x,y)=>y.pts-x.pts);
    const tp = proj ? starters.reduce((a,s)=>a+(s.proj||0),0) : null;
    return {pts:+m.points||0, starters, bench, emptySlots, top:sorted.slice(0,3), best:sorted[0], worst:sorted[sorted.length-1], tb, hb, blunder: tb || hb, proj: tp};
  };

  const games = pairs(week).map(g => {
    let A = {...teams[g.a.roster_id], ...detail(g.a)}, B = {...teams[g.b.roster_id], ...detail(g.b)};
    if (B.pts > A.pts) [A,B] = [B,A];
    for (const S of [A,B]) {
      S.med = weekMedian ? weekMedian.res[S.rid] : null;
      S.before = before ? before[S.rid] : null;
      S.after = rec[S.rid];
      S.streak = streakOf(rec[S.rid].res);
      S.streakBefore = streakOf(before ? before[S.rid].res : []);
      S.rankBefore = rankBefore ? rankBefore[S.rid] : null;
      S.rankAfter = rankAfter[S.rid];
      S.prev = week > 1 ? scores[S.rid][week-1] : undefined;
    }
    return {id:g.id, W:A, L:B, tie:A.pts===B.pts, margin:A.pts-B.pts};
  });
  const sides = games.flatMap(g=>[g.W,g.L]);
  const played = sides.some(s=>s.pts>0);
  const n = sides.length;
  const sortedPts = sides.map(s=>s.pts).sort((a,b)=>b-a);
  for (const S of sides) { S.rank = sortedPts.indexOf(S.pts)+1; S.allPlay = sides.filter(o=>o!==S && o.pts < S.pts).length; }
  const numTeams = Object.keys(teams).length;
  const playoffLine = Math.min(numTeams, (league.settings && league.settings.playoff_teams) || Math.min(6, numTeams));

  // ---- Story angles: every candidate gets a newsworthiness score ----
  const share = (arr, fn) => arr.length ? arr.filter(fn).length / arr.length : 0;
  const injFresh = !!opts.injFresh;
  for (const g of games) {
    const {W, L} = g, m = g.margin, A = [];
    const add = (k, score, side, d = {}) => A.push({k, score, side, d});
    if (g.tie) add("tie", 95);
    else {
      if (m < 6) { const r = share(margins, x=>x > m); add("nailbiter", 38 + 47*r, "W", {closest: margins.every(x=>x >= m)}); }
      if (m >= 30) add("blowout", 18 + 40*share(margins, x=>x < m), "W", {widest: margins.every(x=>x <= m)});
      if (W.proj != null && L.proj != null && L.proj - W.proj >= 8) add("proj_upset", 42 + Math.min(45, (L.proj-W.proj)*1.3), "W", {gap:L.proj-W.proj});
      const thr = medianOn ? 3 : 2;
      if (week > 1 && W.before && L.before && L.before.w - W.before.w >= thr) add("record_upset", Math.min(72, 36 + 8*(L.before.w-W.before.w-thr+1)), "W");
      if (L.tb && L.tb.gain > m) add("true_blunder", 38 + Math.min(15, L.tb.edge*1.5) + Math.min(10, L.tb.gain/2), "L", {bl:L.tb});
      else if (L.hb && L.hb.gain > m && L.hb.gain >= 12) add("hindsight", 16 + Math.min(12, L.hb.gain/3), "L", {bl:L.hb});
      if (L.before && L.before.l===0 && L.before.t===0 && L.before.w>=2) add("unbeaten_falls", Math.min(78, 44 + 4*L.before.w), "L");
      if (L.streakBefore.k==="W" && L.streakBefore.n>=3) add("streak_snap", 34 + 5*L.streakBefore.n, "L", {n:L.streakBefore.n});
      if (W.streakBefore.k==="L" && W.streakBefore.n>=3) add("skid_over", 34 + 5*W.streakBefore.n, "W", {n:W.streakBefore.n});
      if (W.streak.k==="W" && W.streak.n>=3) add("streak_extend", Math.min(55, 18 + 5*W.streak.n), "W", {n:W.streak.n});
      if (week >= 3 && W.before && !W.before.res.includes("W")) add("first_win", 46, "W");
      if (W.prev != null && W.pts - W.prev >= 35) add("swing_up", 24 + Math.min(40, (W.pts-W.prev)/2), "W", {prev:W.prev, delta:W.pts-W.prev});
      if (L.prev != null && L.prev - L.pts >= 35) add("collapse", 24 + Math.min(40, (L.prev-L.pts)/2), "L", {prev:L.prev, delta:L.prev-L.pts});
      if (week > 1 && seasonHigh && seasonHigh.week===week && +seasonHigh.rid===+W.rid) add("season_high", 56, "W");
      if (week > 1 && seasonLow && seasonLow.week===week && +seasonLow.rid===+L.rid) add("season_low", 42, "L");
      if (n >= 6 && L.allPlay >= n-3) add("unlucky", 30 + 7*(L.allPlay-(n-4)), "L");
      if (n >= 6 && W.allPlay <= 2) add("lucky", 32 + 7*(3-W.allPlay), "W");
      // player-level angles
      const boom = W.starters.filter(p=>p.proj!=null && p.pts-p.proj >= 15).sort((a,b)=>(b.pts-b.proj)-(a.pts-a.proj))[0];
      if (boom) add("boom", 30 + Math.min(28, boom.pts-boom.proj) + (boom.pts-boom.proj > m ? 10 : 0), "W", {p:boom});
      else if (W.best && W.best.pts >= 35) add("boom", 28 + Math.min(25, W.best.pts-35), "W", {p:W.best});
      const bust = L.starters.filter(p=>p.proj!=null && p.proj>=12 && p.pts <= p.proj*0.35).sort((a,b)=>(b.proj-b.pts)-(a.proj-a.pts))[0];
      if (bust) add("bust", 28 + Math.min(22, bust.proj-bust.pts) + (bust.proj-bust.pts > m ? 10 : 0), "L", {p:bust});
      if (injFresh) {
        for (const [S,side] of [[L,"L"],[W,"W"]]) {
          const hurt = S.starters.filter(p=>INJURED.has(p.inj) && p.pts < Math.max(4, (p.proj||8)*0.5)).sort((a,b)=>(b.proj||0)-(a.proj||0))[0];
          if (hurt) add("injury", side==="L" ? 36 + ((hurt.proj||0)-hurt.pts > m ? 14 : 0) : 26, side, {p:hurt});
        }
      }
      for (const [S,side] of [[L,"L"],[W,"W"]]) {
        if (bestBall) continue;
        if (S.emptySlots) add("empty_slot", side==="L" ? 48 : 30, side, {k:S.emptySlots});
        else {
          const zero = S.starters.find(p=>p.pts===0 && !["K","DEF"].includes(p.pos) && (p.proj==null || p.proj < 1));
          if (zero && side==="L") add("zero_starter", 38, side, {p:zero});
        }
      }
      const rev = W.starters.filter(p=>formerOwners[p.id] && formerOwners[p.id][L.rid] && p.pts >= 10).sort((a,b)=>b.pts-a.pts)[0];
      if (rev) add("revenge", 50 + Math.min(20, rev.pts-10), "W", {p:rev, how:formerOwners[rev.id][L.rid]});
      const traded = W.starters.filter(p=>acq[p.id] && acq[p.id].rid===+W.rid && acq[p.id].type==="trade" && p.pts>=18).sort((a,b)=>b.pts-a.pts)[0];
      if (traded) add("trade_win", 30 + Math.min(15, traded.pts-18), "W", {p:traded, aw:acq[traded.id].week});
      const pickup = W.starters.filter(p=>acq[p.id] && acq[p.id].rid===+W.rid && acq[p.id].type!=="trade" && p.pts>=15 && p.pts>m).sort((a,b)=>b.pts-a.pts)[0];
      if (pickup) add("waiver_hero", 30 + Math.min(20, pickup.pts-15), "W", {p:pickup, aw:acq[pickup.id].week, how:acq[pickup.id].type});
      if (week > 1 && W.rankAfter===1 && W.rankBefore!==1) add("new_leader", 44, "W");
      if (week > 1 && L.rankBefore===1 && L.rankAfter!==1) add("dethroned", 44, "L");
      if (week > 1 && W.rankBefore<=3 && L.rankBefore<=3) add("titans", 30, "W");
      if (week > 2 && numTeams >= 8 && W.rankBefore >= numTeams-2 && L.rankBefore >= numTeams-2) add("basement", 24, "W");
    }
    if (!A.length) add("default", 10, "W");
    // Stakes: late regular season near the cut line, or playoffs
    const late = po && week < po && week >= po-3;
    g.bubble = late && [W,L].some(S=>Math.abs(S.rankAfter - playoffLine) <= 2);
    g.stakes = (g.bubble ? 12 : 0) + (po && week >= po ? 10 : 0);
    A.sort((a,b)=>b.score-a.score);
    g.angles = A;
  }


  // ---- Hot take candidates (season-long evidence) ----
  const rids = Object.keys(teams);
  const ap = {}, benchSum = {};
  rids.forEach(r=>{ ap[r]={w:0,l:0}; benchSum[r]=0; });
  for (let w=1; w<=week; w++) {
    const ents = (weeks[w]||[]).filter(m=>m.matchup_id!=null && teams[m.roster_id]);
    if (!ents.some(m=>+m.points>0)) continue;
    for (const m of ents) {
      ap[m.roster_id].w += ents.filter(o=>o!==m && +o.points < +m.points).length;
      ap[m.roster_id].l += ents.filter(o=>o!==m && +o.points > +m.points).length;
      const d = detail(m); if (d.hb) benchSum[m.roster_id] += d.hb.gain;
    }
  }
  const pfRank = Object.fromEntries([...rids].sort((a,b)=>rec[b].pf-rec[a].pf).map((r,i)=>[r,i+1]));
  const paRank = Object.fromEntries([...rids].sort((a,b)=>rec[a].pa-rec[b].pa).map((r,i)=>[r,i+1]));
  const tinfo = rid => { const R0 = rec[rid], gms = R0.res.length, hw = R0.res.filter(x=>x==="W").length, apg = ap[rid].w+ap[rid].l;
    return {...teams[rid], rec:R0, apw:ap[rid].w, apl:ap[rid].l, pfRank:pfRank[rid], paRank:paRank[rid], rank:rankAfter[rid], luck: apg ? hw - gms*(ap[rid].w/apg) : 0, bench:benchSum[rid], streak:streakOf(R0.res), wk:scores[rid][week]}; };
  const TI = rids.map(tinfo);
  const nT = rids.length, cut = Math.min(nT, (league.settings && league.settings.playoff_teams) || Math.min(6, nT));
  const TK = [];
  const addT = (k, score, d) => TK.push({k, score, d});
  if (week >= 3) {
    const fraud = TI.filter(t=>t.rank <= Math.ceil(nT/2) && t.luck >= 1.2).sort((a,b)=>b.luck-a.luck)[0];
    if (fraud) addT("fraud", 50 + fraud.luck*14, {t:fraud});
    const sleeper = TI.filter(t=>t.luck <= -1.2).sort((a,b)=>a.luck-b.luck)[0];
    if (sleeper) addT("sleeper", 48 + (-sleeper.luck)*14 + (sleeper.rank > cut ? 8 : 0), {t:sleeper});
    const leader = TI.find(t=>t.rank===1);
    if (leader && leader.paRank === 1 && leader.pfRank > 1) addT("asterisk", 52, {t:leader});
    else if (leader && leader.paRank <= 2) addT("asterisk", 40, {t:leader});
  }
  const topWk = [...TI].filter(t=>t.wk!=null).sort((a,b)=>b.wk-a.wk)[0];
  if (topWk && seasonHigh && seasonHigh.week===week && +seasonHigh.rid===+topWk.rid) addT("overreaction", 46, {t:topWk});
  else if (topWk) addT("overreaction", 22, {t:topWk});
  const coach = [...TI].sort((a,b)=>b.bench-a.bench)[0];
  if (coach && coach.bench >= 25 && week >= 2) addT("coaching", 34 + Math.min(26, coach.bench/4), {t:coach});
  for (let w=1; w<week; w++) for (const t of (txnsByWeek[w]||[])) {
    if (t.status!=="complete" || t.type!=="trade") continue;
    const by = {}; for (const [pid,rid] of Object.entries(t.adds||{})) (by[rid]=by[rid]||[]).push(pid);
    const sd = Object.entries(by); if (sd.length!==2 || !teams[sd[0][0]] || !teams[sd[1][0]]) continue;
    const tot = sd.map(([rid,pids])=>{ let s=0; for (let x=w+1;x<=week;x++){ const m=(weeks[x]||[]).find(e=>+e.roster_id===+rid); if(!m) continue; (m.starters||[]).forEach((id,i)=>{ if (pids.includes(id)) s += +((m.starters_points && m.starters_points[i]) ?? (m.players_points||{})[id] ?? 0); }); } return {rid, pids, s}; }).sort((a,b)=>b.s-a.s);
    const gap = tot[0].s - tot[1].s;
    if (gap >= 12) addT("trade", 52 + Math.min(22, gap/2), {w, win:{...teams[tot[0].rid], s:tot[0].s, players:tot[0].pids.map(P)}, lose:{...teams[tot[1].rid], s:tot[1].s, players:tot[1].pids.map(P)}, gap});
  }
  const hot = TI.filter(t=>t.streak.k==="W" && t.streak.n>=4).sort((a,b)=>b.streak.n-a.streak.n)[0];
  if (hot) addT("forfeit", 34 + 4*hot.streak.n, {t:hot});
  const cold = TI.filter(t=>t.streak.k==="L" && t.streak.n>=3).sort((a,b)=>b.streak.n-a.streak.n)[0];
  if (cold) addT("blowup", 32 + 4*cold.streak.n, {t:cold});
  for (const g of games) {
    if (g.tie) continue;
    const k = g.W.starters.find(p=>p.pos==="K");
    if (k && k.pts > g.margin && k.pts >= 8) addT("kicker", 30 + Math.min(10, k.pts - g.margin), {k, W:g.W, L:g.L, margin:g.margin});
  }
  // Evergreen takes so there's always something fresh to yell about
  const allStarters = games.flatMap(g=>[g.W,g.L].flatMap(S=>S.starters.map(p=>({...p, team:S.team, mgr:S.mgr}))));
  const star = allStarters.filter(p=>!["K","DEF"].includes(p.pos)).sort((a,b)=>b.pts-a.pts)[0];
  if (star && star.pts >= 20) addT("goat", 20 + Math.min(12, (star.pts-20)/2), {p:star});
  const flop = allStarters.filter(p=>p.proj!=null && p.proj>=12 && !["K","DEF"].includes(p.pos)).sort((a,b)=>(b.proj-b.pts)-(a.proj-a.pts))[0];
  if (flop && flop.proj - flop.pts >= 8) addT("benchhim", 22 + Math.min(12, (flop.proj-flop.pts)/2), {p:flop});
  if (weekMedian) { const g = games.find(g=>!g.tie && g.L.med==="W"); if (g) addT("median", 24, {L:g.L, W:g.W, med:weekMedian.med}); }
  const slump = TI.filter(t=>t.rank<=3 && t.wk!=null).sort((a,b)=>a.wk-b.wk)[0];
  if (slump && sides.length && slump.wk <= [...sides].sort((a,b)=>a.pts-b.pts)[Math.min(2, sides.length-1)].pts) addT("sell", 30, {t:slump});
  const prevTake = week > 1 ? prevLight().takeKind : null;
  TK.forEach(t=>{ if (t.k === prevTake) t.score -= 100; });
  TK.sort((a,b)=>b.score-a.score);
  const take = TK[0] || null;

  // Lead + variety: don't run last week's lead angle again unless it's clearly the best story; no repeated angle types on one page
  const prevLead = week > 1 ? prevLight().leadKind : null;
  const FAM = {true_blunder:"bench", hindsight:"bench", proj_upset:"upset", record_upset:"upset", streak_snap:"streak", skid_over:"streak", streak_extend:"streak", unbeaten_falls:"streak"};
  const fam = k => FAM[k] || k;
  const eff = (g, a) => a.score + g.stakes - (prevLead && fam(a.k) === fam(prevLead) ? 30 : 0);
  let lead = null, leadAngle = null;

  const used = new Set();

  const nextOpp = {};
  for (const g of pairs(week+1)) { nextOpp[g.a.roster_id] = teams[g.b.roster_id]; nextOpp[g.b.roster_id] = teams[g.a.roster_id]; }

  // ---- Horoscopes: a unique sign per team (from how they manage) + one prophecy each (half real, half chaos) ----
  const horo = (() => {
    const sideOf = Object.fromEntries(sides.map(S=>[String(S.rid), S]));
    const nextProj = (raw.proj || {})[week+1] || null;
    const byeTeams = new Set();
    if (nextProj) {
      const playing = new Set(Object.keys(nextProj).map(id=>(players[id]||[])[2]).filter(Boolean));
      if (playing.size >= 20) for (const t of new Set(Object.values(players).map(p=>p[2]).filter(Boolean))) if (!playing.has(t)) byeTeams.add(t);
    }
    // season activity per team
    const act = {}; for (const rid of rids) act[rid] = {pickups:0, trades:0, faab:0};
    for (let w=1; w<=week; w++) for (const t of (txnsByWeek[w]||[])) {
      if (t.status !== "complete") continue;
      const who = new Set(Object.values(t.adds||{}).map(String));

    }
    // starts per player per team, and each player's recent scores

    for (let w=1; w<=week; w++) for (const m of (weeks[w]||[])) {
      const rid = String(m.roster_id); starts[rid] = starts[rid] || {};

      for (const [id,pt] of Object.entries(m.players_points||{})) (hist[id] = hist[id] || {})[w] = +pt;
    }
    const played = rids.filter(r=>scores[r] && Object.keys(scores[r]).length);
    if (played.length < 2) return null;
    const stats = rids.map(rid => {
      const sc = Object.values(scores[rid]||{}); const mean = sc.reduce((a,b)=>a+b,0)/(sc.length||1);
      const sd = Math.sqrt(sc.reduce((a,b)=>a+(b-mean)**2,0)/(sc.length||1));

      const unluckyLosses = (weeks ? Array.from({length:week},(_,i)=>i+1) : []).filter(w=>{ const ws = sides.length && (weeks[w]||[]).filter(m=>m.matchup_id!=null).map(m=>+m.points||0); if (!ws || !ws.length) return false;

        bench:t.bench||0, luck:t.luck||0, streak:streakOf(rec[rid].res), stackTeam:stack[0], stackN:stack[1], unluckyLosses, ...act[rid]};
    });
    const ledger = {};
    for (let w=1; w<week; w++) for (const t of (txnsByWeek[w]||[])) {

      const startPts = (rid, pids) => { let s=0; for (let x=w+1; x<=week; x++) { const m=(weeks[x]||[]).find(e=>String(e.roster_id)===rid); if (!m) continue; (m.starters||[]).forEach((id,i)=>{ if (pids.includes(id)) s += +((m.starters_points && m.starters_points[i]) ?? (m.players_points||{})[id] ?? 0); }); } return s; };
      for (const rid of sides2) {

        const net = gotPts - gavePts;
        if (!ledger[rid] || Math.abs(net) > Math.abs(ledger[rid].net)) ledger[rid] = {w, got:got.map(P), gave:gave.map(P), gotPts, gavePts, net, partner: partner && teams[partner] ? teams[partner].team : "a rival"};
      }
    }
    for (const s of stats) s.deal = ledger[s.rid] || null;
    const N = stats.length;
    const secondMost = k => { const v = col(k).sort((a,b)=>b-a); return v[1] || 0; };
    const median = k => { const v = col(k).sort((a,b)=>a-b); return v[Math.floor(v.length/2)] || 0; };
    const pct = (arr, v) => arr.filter(x=>x < v).length / Math.max(1, arr.length-1);
    const col = k => stats.map(s=>s[k]);
    const SIGNS = [
      {k:"tinkerer", g:"♓", name:"The Tinkerer", fit:s=>bestBall?-1:pct(col("bench"),s.bench), why:s=>`${f2(s.bench)} pts left on the bench this season`},
      {k:"snakebitten", g:"♋", name:"The Snakebitten", fit:s=>s.unluckyLosses ? 0.5+0.2*s.unluckyLosses : pct(col("luck").map(x=>-x),-s.luck)*0.8, why:s=>s.unluckyLosses ? `${s.unluckyLosses} loss${s.unluckyLosses>1?"es":""} while outscoring most of the league` : `${Math.abs(s.luck).toFixed(1)} fewer wins than the points deserve`},

      {k:"metronome", g:"♉", name:"The Metronome", fit:s=>s.n>=3 ? pct(col("sd").map(x=>-x),-s.sd) : -1, why:s=>`every score between ${Math.round(s.lo)} and ${Math.round(s.hi)}`},
      {k:"dealmaker", g:"♊", name:"The Dealmaker", fit:s=>(s.trades >= 3 && s.trades >= secondMost("trades") + 2) ? 0.6+0.1*s.trades : -1, why:s=>`${s.trades} trades, the most in the league by a mile`},
      {k:"swindler", g:"♆", name:"The Swindler", fit:s=>s.deal && s.deal.net >= 12 ? 0.6 + Math.min(0.5, s.deal.net/80) : -1, why:s=>`up ${f2(s.deal.net)} pts on the Week ${s.deal.w} trade`},

      {k:"latebloomer", g:"❀", name:"The Late Bloomer", fit:s=>0.02, why:s=>`still waiting for the season to start`, generic:true},

      {k:"sidekick", g:"⚐", name:"The Sidekick", fit:s=>0.002, why:s=>`in someone else's story, for now`, generic:true},

    // greedy unique assignment: best team-sign fits first

      const z = SIGNS.find(z=>!usedSign.has(z.k) && z.fit(s) > -0.5) || SIGNS.find(z=>!usedSign.has(z.k) && z.generic) || SIGNS.find(z=>z.generic);

      const cold = S.starters.find(p=>{ const h = hist[p.id]||{}; const a = h[week-2], b = h[week-1], c = h[week]; return a!=null && b!=null && c!=null && a > b && b > c && c < a*0.6 && a >= 8; });
      if (cold) real("badomen", 65, {p:cold});

    }

  // Awards
  const starters = sides.flatMap(S=>S.starters.map(p=>({...p, team:S.team})));

    .sort((a,b)=>(b.w+b.t/2)-(a.w+a.t/2) || b.pf-a.pf);

  const P_ = P;

  // ---- Playoff Picture: seeds, bracket, simulated odds (byes factored in), clinch math ----
  const playoff = (() => {
    const P = playoffLine, regLast = po ? po - 1 : 0;

    const roundWeek = r => po + (rt === 2 ? 2*r : r);
    const rids = Object.keys(teams).map(String);
    const seedsNow = standings.slice(0, P);
    const W0 = r => rec[r].w + rec[r].t/2;
    // ---------- seeding order + bracket shape ----------
    let order = [1, 2];
    while (order.length < B) { const n = order.length*2 + 1; order = order.flatMap(s => [s, n - s]); }
    const seedTeam = s => s <= P ? standings[s-1] : null;
    const bracket = [];
    let slots = order.map(s => ({seed:s, team:seedTeam(s)}));
    for (let r = 0; r < rounds; r++) {
      const ms = [];
      for (let i=0; i<slots.length; i+=2) ms.push([slots[i], slots[i+1]]);
      bracket.push({label: r === rounds-1 ? "Championship" : r === rounds-2 ? "Semifinals" : `Round ${r+1}`, week: roundWeek(r), matches: ms});
      slots = ms.map(([a,b]) => {
        if (a.team && (!b || !b.team)) return a;               // bye: the seed advances
        if (b.team && (!a || !a.team)) return b;
        return {tbd: `Winner ${Math.min(a.seed,b.seed)} / ${Math.max(a.seed,b.seed)}`, seeds:[a.seed,b.seed]};
      });
    }
    // ---------- team strength ----------
    const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
    const sdev = a => { const m = mean(a); return Math.sqrt(mean(a.map(x=>(x-m)**2))); };
    const past = r => Array.from({length:Math.min(week, regLast)},(_,i)=>i+1).map(w=>scores[r][w]).filter(v=>v!=null && v>0);
    const all = rids.flatMap(past), lgMean = mean(all) || 100, lgSd = sdev(all) || 25;
    const str = {};
    for (const r of rids) { const sc = past(r); const m = sc.length ? mean(sc) : lgMean; const l3 = sc.length ? mean(sc.slice(-3)) : m;
      str[r] = {mu: sc.length ? 0.6*m + 0.4*l3 : lgMean, sd: Math.max(12, sc.length > 1 ? 0.5*sdev(sc) + 0.5*lgSd : lgSd)}; }
    // players' typical output (for bye fill-ins)
    const pts = {};
    for (let w=1; w<=week; w++) for (const m of (weeks[w]||[])) for (const [id,v] of Object.entries(m.players_points||{})) if (+v > 0) (pts[id] = pts[id] || []).push(+v);
    const pavg = id => pts[id] ? mean(pts[id]) : 0;
    const rosterOf = Object.fromEntries(rosters.map(r=>[String(r.roster_id), r]));
    const lineup = r => { const R0 = rosterOf[r] || {}; const nb = notBench[r] || new Set();
      const starters = (R0.starters||[]).map((id,i)=>({id, slot:slots_[i]})).filter(x=>x.id && x.id!=="0");
      const bench = (R0.players||[]).filter(id=>!(R0.starters||[]).includes(id) && !nb.has(id));
      return {starters, bench}; };
    const slots_ = (league.roster_positions||[]).filter(s=>!["BN","IR","TAXI"].includes(s));
    // next week: realistic best lineup from projections (byes/injuries auto-filled from the bench)
    const nextProj = (raw.proj||{})[week+1] || null;
    const nextMu = {};
    if (nextProj && weeksLeft > 0) for (const r of rids) {
      const R0 = rosterOf[r]; if (!R0) continue;
      const pool = (R0.players||[]).filter(id=>!(notBench[r]||new Set()).has(id)).map(id=>({id, ...P_(id), pj: nextProj[id] || 0})).filter(p=>p.pj > 0 && !INJURED.has(p.inj));
      const order2 = [...slots_].sort((a,b)=>(ELIG[a]||[a]).length - (ELIG[b]||[b]).length);
      const used = new Set(); let tot = 0, filled = 0;
      for (const s of order2) { const el = ELIG[s] || [s]; const best = pool.filter(p=>!used.has(p.id) && el.includes(p.pos)).sort((a,b)=>b.pj-a.pj)[0]; if (best) { used.add(best.id); tot += best.pj; filled++; } }
      if (filled >= slots_.length*0.7) nextMu[r] = 0.5*str[r].mu + 0.5*tot;
    }
    // later weeks: bye dips (starter on bye minus best bench fill-in)
    const byeW = raw.byeWeeks || {}, hasByes = Object.keys(byeW).length > 0;
    const dip = {}, dipNote = {};
    for (const r of rids) { dip[r] = {}; const L = lineup(r);
      for (let fw = week+1; fw <= regLast; fw++) { const off = new Set(byeW[fw] || []); if (!off.size) continue;
        const used = new Set(); let d = 0; const lost = [];
        for (const s of L.starters) { const p = P_(s.id); if (!off.has(p.nfl)) continue;
          const el = ELIG[s.slot] || [p.pos];
          const rep = L.bench.filter(id=>!used.has(id) && el.includes(P_(id).pos) && !off.has(P_(id).nfl) && !INJURED.has(P_(id).inj)).sort((a,b)=>pavg(b)-pavg(a))[0];
          if (rep) used.add(rep);
          const loss = Math.max(0, pavg(s.id) - (rep ? pavg(rep) : 0)); d += loss; lost.push(p);
        }
        if (d > 0) { dip[r][fw] = d; if (!dipNote[r] || d > dipNote[r].d) dipNote[r] = {d, w:fw, lost}; }
      }
    }
    // ---------- simulate the rest of the regular season ----------
    const future = []; for (let fw = week+1; fw <= regLast; fw++) { const pr = pairs(fw); if (pr.length) future.push({w:fw, pr}); }
    const N = future.length ? 4000 : 1;
    const R2 = rng(hash(league.league_id + ":playoffs:" + week));
    const normal = () => { let u = 0; while (!u) u = R2(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*R2()); };
    const make = {}, bye = {}, seedCt = {}, rankCt = {}, first = {}, cw = {}, cl = {};
    for (const r of rids) { make[r]=0; bye[r]=0; first[r]=0; seedCt[r]={}; rankCt[r]={}; cw[r]={n:0,m:0}; cl[r]={n:0,m:0}; }
    const nextPairs = future.length && future[0].w === week+1 ? future[0].pr : [];
    const nextWon = {};
    for (let s = 0; s < N; s++) {
      const w = {}, pf = {}; for (const r of rids) { w[r] = W0(r); pf[r] = rec[r].pf; }
      for (const f of future) {
        const sc = {};
        for (const g of f.pr) for (const r of [String(g.a.roster_id), String(g.b.roster_id)]) {
          const base = (f.w === week+1 && nextMu[r] != null ? nextMu[r] : str[r].mu) - (dip[r][f.w] || 0);
          sc[r] = Math.max(20, base + str[r].sd * normal()); pf[r] += sc[r];
        }
        for (const g of f.pr) { const a = String(g.a.roster_id), b = String(g.b.roster_id);
          if (sc[a] > sc[b]) w[a]++; else if (sc[b] > sc[a]) w[b]++; else { w[a]+=.5; w[b]+=.5; }
          if (f.w === week+1) { nextWon[a] = sc[a] > sc[b]; nextWon[b] = sc[b] > sc[a]; } }
        if (medianOn) { const v = Object.values(sc).sort((x,y)=>x-y), k = v.length; const md = k%2 ? v[(k-1)/2] : (v[k/2-1]+v[k/2])/2; for (const r in sc) if (sc[r] > md) w[r]++; }
      }
      const ranked = [...rids].sort((a,b)=>w[b]-w[a] || pf[b]-pf[a]);
      ranked.forEach((r,i)=>{ rankCt[r][i+1] = (rankCt[r][i+1]||0) + 1; if (i < P) { make[r]++; seedCt[r][i+1] = (seedCt[r][i+1]||0)+1; } if (i < byes) bye[r]++; if (i === 0) first[r]++; });
      for (const g of nextPairs) for (const r of [String(g.a.roster_id), String(g.b.roster_id)]) { const c = nextWon[r] ? cw[r] : cl[r]; c.n++; if (ranked.indexOf(r) < P) c.m++; }
    }
    // ---------- exact clinch / elimination (ties treated as danger) ----------
    const left = {}; for (const r of rids) left[r] = future.filter(f=>f.pr.some(g=>String(g.a.roster_id)===r || String(g.b.roster_id)===r)).length * (medianOn ? 2 : 1);
    const maxW = r => W0(r) + left[r];
    const clinched = r => rids.filter(q=>q!==r && maxW(q) >= W0(r)).length < P;
    const clinchedBye = r => byes > 0 && rids.filter(q=>q!==r && maxW(q) >= W0(r)).length < byes;
    const elim = r => rids.filter(q=>q!==r && W0(q) > maxW(r)).length >= P;
    const pct = r => make[r] / N;
    const mode = obj => { let best = null, n = -1; for (const [k,v] of Object.entries(obj)) if (v > n) { n = v; best = +k; } return best; };
    const table = standings.map((s,i)=>{ const r = String(s.rid);
      const p = clinched(r) ? 1 : elim(r) ? 0 : pct(r);
      const tier = clinched(r) ? "clinched" : elim(r) ? "out" : p >= 0.99 ? "lock" : p >= 0.75 ? "in" : p >= 0.15 ? "bubble" : "miracle";
      return {rid:r, team:s.team, mgr:s.mgr, rec:recStr(s), seed:i+1, p, pBye: byes ? (clinchedBye(r) ? 1 : bye[r]/N) : 0, p1: first[r]/N, likely: mode(rankCt[r]), tier,
        mu: str[r].mu, winP: cw[r].n ? cw[r].m/cw[r].n : null, loseP: cl[r].n ? cl[r].m/cl[r].n : null, dipNote: dipNote[r] || null, clinched: clinched(r), clinchedBye: clinchedBye(r), elim: elim(r)}; });
    const byRid = Object.fromEntries(table.map(t=>[t.rid,t]));
    // game of the week: biggest playoff-odds swing
    let gotw = null;
    for (const g of nextPairs) { const a = byRid[String(g.a.roster_id)], b = byRid[String(g.b.roster_id)]; if (!a || !b || a.winP==null || b.winP==null || a.loseP==null || b.loseP==null) continue;
      const sw = (a.winP - a.loseP) + (b.winP - b.loseP); if (sw > 0.08 && (!gotw || sw > gotw.sw)) gotw = {a, b, sw}; }
    const gb = (a, b) => (W0(a) - W0(b));
    const cutTeam = standings[P-1], outTeam = standings[P];
    return {stage, P, byes, weeksLeft, regLast, po, rounds, bracket, table, gotw, hasByes, sims: N,
      cutGap: cutTeam && outTeam ? gb(String(cutTeam.rid), String(outTeam.rid)) : 0};
  })();

  const wire = (txnsByWeek[week]||[]).filter(t=>t.status==="complete").map(t=>({
    type:t.type, bid:t.settings && t.settings.waiver_bid,
    adds:Object.entries(t.adds||{}).map(([pid,rid])=>({p:P(pid), team:tname(rid)})),
    drops:Object.entries(t.drops||{}).map(([pid,rid])=>({p:P(pid), team:tname(rid)}))
  }));

  const Mout = {
    leagueId: league.league_id, leagueName: league.name || "Fantasy League", season: league.season, week, po,
    playoffs: !!(po && week >= po), hasProj: !!proj, prevLead,
    medianOn, median: weekMedian ? weekMedian.med : null, games, played, n, numTeams,
    awards:{pow, beat, bust:bustA, dud, blund, unlucky, lucky, top}, take, standings, power, playoffLine, wire, nextOpp, horo, playoff
  };
  Object.defineProperty(Mout, "raw", {value: raw, enumerable: false});
  if (!opts.light && Mout.playoffs) Mout.br = buildBracket(raw, Mout, scores, teams);
  return Mout;
}

/* ---------------- The writers' room (built-in) ---------------- */

const poss = s => /s$/i.test(s) ? s + "'" : s + "'s";
const pname = p => p.pos === "DEF" ? `the ${p.name} defense` : p.name;
const Pname = p => { const s = pname(p); return s[0].toUpperCase() + s.slice(1); };
const plast = p => p.pos === "DEF" ? lastName(p.name) + " D" : lastName(p.name);

function writeGame(g, M, r, isLead, ed){
  const {W,L} = g, hero = W.best || {name:"the lineup",pts:0,pos:"",nfl:""}, lhero = L.best || {name:"nobody",pts:0};
  const x = {g, W:W.team, L:L.team, ws:f2(W.pts), ls:f2(L.pts), mg:f2(g.margin), wk:M.week, n:M.n, hl:plast(hero)};
  const a = g.primary, T = ANG[a.k] || ANG.default;
  const headline = pick(r, T.heads(x, a));
  const dek = g.tie
    ? `Both teams leave Week ${M.week} at ${recStr(W.after)} and ${recStr(L.after)}, and nobody is happy about it`
    : `${hero.name} scores ${f2(hero.pts)}; ${W.team} now ${recStr(W.after)}, ${L.team} ${recStr(L.after)}`;
  const body = [T.lede(x, a, r)];
  if (W.top.length && !(a.k==="boom" && a.d.p && a.d.p.id===hero.id && W.top.length<2)) {
    let p = `${Pname(hero)} (${[hero.pos,hero.nfl].filter(Boolean).join(", ")}) ${pick(r,["led the way","did the heavy lifting","carried the load","was the difference"])} with ${f2(hero.pts)} points`;
    if (W.top[1]) p += `, and ${pname(W.top[1])} added ${f2(W.top[1].pts)}`;
    p += `. For ${L.team}, ${pname(lhero)} ${pick(r,["kept it respectable","refused to go quietly","was a lone bright spot","did not go quietly"])} with ${f2(lhero.pts)}.`;
    body.push(p);
  }
  // Secondary angles become supporting lines (different types, max 2 or 3 for the lead)
  const extra = [];
  const seen = new Set([a.k]);
  for (const b of g.angles) {
    if (extra.length >= (isLead ? 3 : 2)) break;
    if (seen.has(b.k) || b.score < 26) continue;
    if ((a.k==="true_blunder"||a.k==="hindsight") && (b.k==="true_blunder"||b.k==="hindsight")) continue;
    const s = (ANG[b.k]||ANG.default).line(x, b);
    if (s) { extra.push(s); seen.add(b.k); }
  }
  if (g.bubble) {
    const left = M.po - M.week;
    extra.push(`With the playoffs ${left} week${left>1?"s":""} away, ${W.team} sits ${ord(W.rankAfter)} and ${L.team} ${ord(L.rankAfter)}. The top ${M.playoffLine} get in.`);
  }
  if (M.median != null && !g.tie) {
    const wm = W.med, lm = L.med, md = f2(M.median);
    if (wm==="W" && lm==="W") extra.push(`Both teams cleared the league median of ${md}, so ${W.team} banks a 2-0 week and ${L.team} salvages a 1-1 split.`);
    else if (wm==="W") extra.push(`${W.team} also cleared the league median of ${md} for a clean 2-0 week; ${L.team} goes 0-2.`);
    else if (lm!=="W") extra.push(`Neither team reached the league median of ${md}, so ${W.team} settles for a 1-1 week and ${L.team} goes 0-2.`);
  }
  if (!g.tie) extra.push(`${W.team} ${M.median!=null?"is now":"moves to"} ${recStr(W.after)}; ${L.team} ${M.median!=null?"sits at":"drops to"} ${recStr(L.after)}.`);
  if (extra.length) body.push(extra.join(" "));
  if (!g.tie) { const c = closer(g, a, isLead, r, M, ed, x, hero); if (c) body.push(c); }
  const next = !g.tie && M.nextOpp[W.rid] ? `Next week: ${W.team} vs. ${M.nextOpp[W.rid].team} · ${L.team} vs. ${(M.nextOpp[L.rid]||{}).team || "TBD"}` : "";
  return {id:g.id, kicker:(M.playoffs ? "Playoffs · " : "") + T.kicker, headline, dek, body, next};
}

function closer(g, a, isLead, r, M, ed, x, hero){
  const W = g.W, L = g.L;
  const p = a.d && a.d.p, bl = a.d && a.d.bl;
  const vars = {W:W.team, L:L.team, wm:W.mgr, lm:L.mgr, hero:pname(hero), mg:x.mg,
    WN:(M.nextOpp[W.rid]||{}).team, LN:(M.nextOpp[L.rid]||{}).team,
    p: p ? pname(p) : "", starter: bl ? pname(bl.s) : "", bench: bl ? pname(bl.b) : "", bpts: bl ? f2(bl.b.pts) : ""};
  const fill = s => s.replace(/\{(\w+)\}/g, (_,k)=>vars[k] ?? "");
  const take = pool => {
    const usable = s => !ed.used.has(s) && !/\{(\w+)\}/.test(s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]?"":m));
    // alternate halves of each pool by week, so back-to-back weeks never reuse a line
    let ok = pool.filter((s,i)=>(pool.length < 2 || i % 2 === M.week % 2) && usable(s));
    if (!ok.length) ok = pool.filter(usable);
    if (!ok.length) return null;
    const i = (ed.base + M.week*ed.step + ed.slot++) % ok.length;
    ed.used.add(ok[i]); return fill(ok[i]);
  };
  const angle = Q_ANGLE[a.k] || [];
  const roll = r();
  if (isLead) {
    const first = (angle.length && take(angle)) || take(r()<.5 ? Q_WIN : Q_LOSE);
    const second = r() < .55 ? take(first && first.includes("@"+W.mgr) ? Q_LOSE : Q_WIN) : null;
    return [first, second].filter(Boolean).join(" ") || null;
  }
  if (roll < .22) return null;                                     // sometimes the story just ends
  if (roll < .55 && angle.length) return take(angle) || take(Q_LOSE);
  if (roll < .72) return take(r()<.5 ? Q_WIN : Q_LOSE);
  if (roll < .86 && vars.WN && vars.LN) return take(Q_TEASE);
  return take(Q_JAB);
}

function writeColumn(M, r){
  const tk = M.take;
  if (!tk) return null;
  const d = tk.d, t = d.t;
  const rc = t ? recStr(t.rec) : "";
  const P2 = (a,b) => pick(r,[a,b]);
  let headline, body;
  switch (tk.k) {
    case "fraud":
      headline = P2(`Fraud alert: ${t.team} is ${rc} and it's a lie`, `${t.team} is the biggest fraud in this league, and I have the receipts`);
      body = [`Let me say what nobody else in this league has the guts to say. ${t.team} is a FRAUD. ${rc}? Cute. Play every team every week and ${t.team} is ${t.apw}-${t.apl}. ${ord(t.pfRank)} in points scored. That's not a contender. That's a team that keeps drawing the one opponent having a worse week.`,
        `${t.team} has won ${t.luck.toFixed(1)} more games than its scoring deserves. Luck runs out, @${t.mgr}. It always does. And when it does, don't come crying to me.`, `I said what I said.`];
      break;
    case "sleeper":
      headline = P2(`${t.team} is the best team nobody wants to admit is good`, `Mark it down: ${t.team} is coming, and you should be scared`);
      body = [`Everybody's looking at the standings and laughing at ${t.team}. ${rc}. Ha ha. You know what I'm looking at? ${f2(t.rec.pf)} points, ${ord(t.pfRank)} in the league. Play everybody every week and they're ${t.apw}-${t.apl}. This team has lost ${Math.abs(t.luck).toFixed(1)} more games than it deserves.`,
        `That's not a bad team. That's a bad-luck team, and bad luck doesn't last. ${t.rank > M.playoffLine ? `They're ${ord(t.rank)} right now. They're making the playoffs. Write it down.` : `And they're STILL in a playoff spot. Imagine when the luck turns.`}`, `Don't @ me. Actually, do. I'll be here.`];
      break;
    case "asterisk":
      headline = P2(`Put an asterisk next to ${poss(t.team)} record`, `${t.team} is ${rc} against a schedule made of tissue paper`);
      body = [`${t.team} is ${rc}, sitting in first, and everybody's already engraving the trophy. Slow. Down. ${t.paRank===1?"Nobody in this league has faced less resistance":"Almost nobody in this league has faced less resistance"}: ${f2(t.rec.pa)} points against${t.paRank===1?", the fewest in the league":""}. They haven't been tested. They've been escorted.`,
        `Beat somebody real, @${t.mgr}. Then we'll talk.`];
      break;
    case "overreaction":
      headline = pick(r,[`${t.team} is winning the championship. I'm not overreacting.`, `Cancel the season. ${t.team} already won it.`, `Week ${M.week}, and I'm calling it: ${t.team} wins it all`]);
      body = [`${f2(t.wk)} points. ${f2(t.wk)}! Is it Week ${M.week}? Yes. Is that a small sample size? Maybe. Do I care? ABSOLUTELY NOT. ${t.team} just put the entire league on notice.`,
        `Everybody else is playing for second place. Book it. Frame this page. Show it to your grandkids. And if I'm wrong, this column never happened.`];
      break;
    case "coaching":
      headline = t.rank <= 3 ? P2(`${t.team} is winning in spite of @${t.mgr}`, `Imagine ${t.team} with a competent lineup-setter`) : P2(`It's not the roster. It's @${t.mgr}.`, `${t.team} has a coaching problem, and the coach is @${t.mgr}`);
      body = [`I've been doing this a long time, and I have never seen anything like it. ${t.team} has left ${f2(t.bench)} points on the bench this season. ${f2(t.bench)}! That's the most in the league, and I'm only counting the single worst lineup call each week.`,
        t.rank <= 3 ? `And they're ${rc}! Imagine this roster with somebody competent pressing the buttons. It would be ${f2(t.rec.pf + t.bench)} points of pure terror. @${t.mgr}, you're not a genius. You're a passenger.` : `The players are there. The points are there. The lineup is the problem. ${rc} with this roster? Somebody take the phone away from @${t.mgr} before Sunday.`];
      break;
    case "goat":
      headline = P2(`${d.p.name} is the best player in fantasy football and it's not close`, `Put ${d.p.name} in the Hall of Fame. Today.`);
      body = [`${f2(d.p.pts)} points. I watched every snap and I'm still not over it. ${d.p.name} is the best fantasy player on the planet, and if you disagree, you're wrong. ${d.team_note || `${d.p.team} knows it. @${d.p.mgr} knows it.`}`,
        `Anybody in this league trying to trade for ${lastName(d.p.name)}: don't bother. Not for your whole roster. Not for your firstborn.`];
      break;
    case "benchhim":
      headline = P2(`Bench ${d.p.name}. I don't care what the projections say.`, `${d.p.name} is washed, and somebody has to say it`);
      body = [`Projected for ${f2(d.p.proj)}. Delivered ${f2(d.p.pts)}. That's not a slump. That's a statement. ${d.p.name} is cooked, and ${d.p.team} is the last to know.`,
        `@${d.p.mgr}, if ${lastName(d.p.name)} is in your lineup next week, that's on you. I warned you. In print.`];
      break;
    case "median":
      headline = P2(`The median game is a participation trophy`, `Abolish the median win. I'm dead serious.`);
      body = [`${d.L.team} LOST this week. Lost! ${f2(d.L.pts)} to ${f2(d.W.pts)}. And what did they get for it? A win. A free, gift-wrapped win for scoring more than ${f2(d.med)}, which is to say, for being slightly above average.`,
        `In my day you beat the guy in front of you or you went home. This league is handing out trophies for showing up. Shameful.`];
      break;
    case "sell":
      headline = P2(`Sell your ${t.team} stock. Now.`, `The ${t.team} bubble just popped`);
      body = [`${t.team} is ${rc}, ${ord(t.rank)} in the standings, and just put up ${f2(t.wk)}, one of the worst scores in the league this week. Everybody's going to call it a blip. I'm calling it what it is: the beginning of the end.`,
        `Top teams don't score ${f2(t.wk)}. Frauds do. Get out while you can.`];
      break;
    case "trade": {

function writeHoroscopes(M, variant){
  if (!M.horo || !M.horo.list || !M.horo.list.length) return null;
  const used = new Set();
  const choose = (arr, seed) => { const n = arr.length; const start = hash(seed) % n; for (let i=0;i<n;i++) { const c = arr[(start+i)%n]; if (!used.has(c)) { used.add(c); return c; } } return arr[start]; };
  const V = variant ? ":v"+variant : "";
  const items = M.horo.list.map(s => {
    const z = s.sign, seed = `${M.leagueId}:${M.week}:${s.rid}${V}`;
    const jab = choose(HORO_JAB[z.k] || HORO_JAB.metronome, seed+":j")(s);
    const pro = s.omen ? choose(HORO_OMEN[s.omen.k], seed+":o")(s.omen.d) : choose(HORO_QUIET, seed+":q");
    const luck = choose(HORO_LUCK[z.k] || HORO_LUCK.metronome, seed+":l");
    return {g:z.g, sign:z.name, why:z.why(s), team:s.team, jab, pro, luck, real: s.omen ? (s.omen.real ? 'r' : 'c') : 'q'};
  });
  return {forWeek: M.horo.forWeek, items};
}


/* ---------------- Playoff Picture (Dr. Seedwell, Bracketologist) ---------------- */
const NUMW = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const numw = n => NUMW[n] || String(n);
const Cap = s => s[0].toUpperCase() + s.slice(1);
const pctS = p => p >= 0.995 && p < 1 ? ">99%" : p > 0 && p < 0.005 ? "<1%" : `${Math.round(p*100)}%`;
function writePlayoffs(M, variant){
  const X = M.playoff; if (!X || X.stage < 2) return null;
  const r = rng(hash(`${M.leagueId}:${M.week}:po${variant ? ":v"+variant : ""}`));
  const T = X.table, P = X.P, top = T[0];
  const contenders = T.filter(t=>!t.clinched && !t.elim && t.p > 0.1 && t.p < 0.9);
  const locked = T.filter(t=>t.p >= 0.9).length;
  const chairs = Math.max(0, P - locked);
  let headline;
  if (X.weeksLeft === 0) headline = `The bracket is set. Let the chaos begin.`;
  else if (contenders.length >= 3 && chairs >= 1) headline = `${Cap(numw(contenders.length))} teams, ${chairs === 1 ? "one chair" : numw(chairs) + " chairs"}: the fight for ${chairs === 1 ? `the ${ord(P)} seed` : `the last ${numw(chairs)} spots`}`;
  else if (X.byes && T.filter(t=>t.pBye > 0.1 && t.pBye < 0.9).length >= 2) headline = `Forget the playoffs. The real race is for a bye.`;
  else headline = pick(r, [`${top.team} and everybody else`, `The field is taking shape. Mostly.`]);
  const body = [];
  if (top.p1 >= 0.8 || top.clinched) body.push(`I have ${top.team} locked into the 1 seed. ${top.clinched ? "They've clinched a spot already" : `They finish first in ${pctS(top.p1)} of my simulations`}, and nobody is catching a ${top.rec} team without help.`);
  else body.push(`The 1 seed is still up for grabs. ${top.team} holds it at ${top.rec}, but only finishes first in ${pctS(top.p1)} of my simulations. That's not a lead. That's a rental.`);
  const holder = T[P-1], chaser = T[P];
  if (X.weeksLeft > 0 && holder && chaser) {
    const race = T.filter(t=>!t.clinched && !t.elim && t.p > 0.05 && t.p < 0.95 && t.seed >= P).sort((a,b)=>b.p-a.p);
    const best = race[0];
    const others = race.filter(t=>t.rid !== holder.rid).slice(0,2);
    const list = others.map(t=>`${t.team} (${pctS(t.p)})`).join(" and ");
    let p2 = `The real story is the ${ord(P)} seed. ${holder.team} holds it today at ${holder.rec}, with ${chaser.team} ${X.cutGap === 0 ? "level on record" : `${X.cutGap} game${X.cutGap===1?"":"s"} back`}.`;
    if (best && best.rid !== holder.rid) p2 += ` My gut says ${holder.team}. My spreadsheet says ${best.team}, at ${pctS(best.p)} to get in. I have never once trusted my gut.`;
    else if (holder.p < 0.5) p2 += ` Holding it and keeping it are different things: ${holder.team} only makes the field in ${pctS(holder.p)} of my simulations${list ? `, with ${list} breathing down its neck` : ""}.`;
    else p2 += ` My numbers agree, ${pctS(holder.p)} to get in${list ? `, but ${list} are not going quietly` : ""}.`;
    body.push(p2);
  }
  const contendersT = T.filter(t=>t.p >= 0.5).sort((a,b)=>b.mu-a.mu);
  const champ = contendersT[0], runner = contendersT[1];
  const sleeper = T.filter(t=>t.seed >= 3 && t.seed <= P && champ && t.rid !== champ.rid && (!runner || t.rid !== runner.rid)).sort((a,b)=>b.mu-a.mu)[0];
  let p3 = champ && runner ? `Title pick: ${champ.team} over ${runner.team}.` : champ ? `Title pick: ${champ.team}.` : "";
  if (sleeper) p3 += ` Upset special: ${sleeper.team} as the ${ord(sleeper.seed)} seed, bouncing somebody who thought they were safe.`;
  if (p3) body.push(p3);
  // clinch watch
  const cl = [];
  for (const t of T) {
    if (t.clinchedBye) cl.push({k:"y", l:"Clinched", t:`${t.team} ${X.weeksLeft ? "has locked up" : "earned"} a first-round bye.`});
    else if (t.clinched) cl.push({k:"y", l:"Clinched", t:`${t.team} has clinched a playoff spot.`});
  }
  for (const t of T) if (!t.clinched && !t.elim && t.winP != null && t.winP >= 0.995 && t.p < 0.99) cl.push({k:"q", l:"Win and in", t:`A win next week all but locks up a spot for ${t.team}.`});
  for (const t of T) if (!t.clinched && !t.elim && t.loseP != null && t.loseP <= 0.005 && t.p > 0.005) cl.push({k:"x", l:"On the brink", t:`A loss next week would all but end ${poss(t.team)} season.`});
  const outs = T.filter(t=>t.elim);
  if (outs.length) cl.push({k:"x", l:"Eliminated", t:`${outs.map(t=>t.team).join(", ")}. ${outs.length > 1 ? "Thoughts and prayers to all of them." : "Thoughts and prayers."}`});
  if (!cl.length) cl.push({k:"q", l:"Status", t:"Nothing's decided yet. Everyone is still alive, technically."});
  // bye note
  let byeNote;
  if (!X.weeksLeft) byeNote = "";
  else if (!X.hasByes) byeNote = "The bye-week schedule couldn't be loaded, so these odds lean on scoring history alone.";
  else {
    const hit = T.filter(t=>t.dipNote && !t.elim).sort((a,b)=>b.dipNote.d-a.dipNote.d)[0];
    const clean = T.filter(t=>!t.dipNote && !t.elim && t.p > 0.05 && t.p < 0.95);
    byeNote = hit ? `${hit.team} loses ${hit.dipNote.lost.slice(0,2).map(pname).join(" and ")} to byes in Week ${hit.dipNote.w}, about ${an(Math.round(hit.dipNote.d))} ${Math.round(hit.dipNote.d)}-point hit after bench fill-ins.` : "No contender loses a key starter to a bye the rest of the way.";
    if (clean[0]) byeNote += ` ${poss(clean[0].team)} schedule is bye-free the rest of the way.`;
  }
  return {headline, body, clinch: cl.slice(0,6), byeNote, champ: champ && runner ? `${champ.team} over ${runner.team}` : champ ? champ.team : null};
}

function writeEdition(M, variant = 0){
  const V = variant ? ":v" + variant : "";
  const r = rng(hash(M.leagueId + ":" + M.week + V));
  const lead = [...M.games].sort((a,b)=>b.priority-a.priority)[0];
  const stories = {};
  const ed = {used:new Set(), slot:0, base:hash(M.leagueId + V), step:Math.max(7, M.games.length*2+1)};
  const order = [lead, ...M.games.filter(g=>g!==lead)].filter(Boolean);
  for (const g of order) stories[g.id] = writeGame(g, M, rng(hash(M.leagueId+":"+M.week+":"+g.id+V)), g===lead, ed);
  const E = {leadId: lead ? lead.id : null, stories, column: writeColumn(M, r), byline: pick(r, STAFF), horo: writeHoroscopes(M, variant), po: writePlayoffs(M, variant), ai:false};
  return M.br ? playoffEdition(M, E, M.raw, variant) : E;
}

function editionText(){

  if (ls) { L.push(`🔥 ${ls.headline.toUpperCase()}`, ls.dek, ""); }
  for (const g of M.games) L.push(`${g.W.team} ${f2(g.W.pts)} – ${g.L.team} ${f2(g.L.pts)}  |  ${E.stories[g.id].headline}`);
  const A = M.awards; L.push("");
  if (A.pow) L.push(`🏆 Player of the week: ${A.pow.name} (${f2(A.pow.pts)}, ${A.pow.team})`);
  if (A.blund) L.push(`🪑 ${A.blund.real?"Bench blunder":"Hindsight award"}: ${A.blund.team} left ${f2(A.blund.gain)} on the pine (${A.blund.b.name})`);

}

function npFit(page){
  const inner = page.firstElementChild;
  const set = v => page.style.setProperty("--fs", v+"px");
  const fits = () => inner.scrollHeight <= NP_H;
  const mast = page.querySelector(".np-mast");
  if (mast) { let s = 118; mast.style.fontSize = s+"px"; while (mast.scrollWidth > mast.parentElement.clientWidth && s > 44) { s -= 3; mast.style.fontSize = s+"px"; } }
  const h1 = page.querySelector(".np-h1");
  if (h1) { let s = 84; h1.style.fontSize = s+"px"; while (h1.scrollHeight > 300 && s > 40) { s -= 3; h1.style.fontSize = s+"px"; } }
  let lo = 8, hi = 21;
  for (let k=0; k<10; k++) { const mid = (lo+hi)/2; set(mid); if (fits()) lo = mid; else hi = mid; }
  set(Math.floor(lo*4)/4);
}

async function renderPaper(onlyFront){
  await Promise.all([loadScript(LIBS.h2c), onlyFront ? null : loadScript(LIBS.pdf)]);
  try { await document.fonts.ready; } catch(e){}
  const host = document.createElement("div");
  host.className = "np-host";
  host.innerHTML = (state.model.isDraft ? npDraftHTML : npHTML)(state.model, state.edition).slice(0, onlyFront ? 1 : undefined).join("");
  document.body.appendChild(host);
  try {
    const pages = [...host.querySelectorAll(".np-page")];
    pages.forEach(npFit); fixMapLabels(host);
    const canvases = [];
    for (let i=0;i<pages.length;i++) {
      setStatus(`Printing page ${i+1} of ${pages.length}…`);
      canvases.push(await window.html2canvas(pages[i], {scale:2, backgroundColor:"#f3efe4", width:NP_W, height:NP_H, windowWidth:NP_W, logging:false, useCORS:true}));
    }
    return canvases;
  } finally { host.remove(); }
}

function slug(s){ return String(s).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "gazette"; }
async function deliverFile(blob, filename){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dl) { await dl.save({filename, data:blob}); return "saved"; }
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return "shared"; } catch(e){ if (e && e.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return "saved";
}
async function downloadPaper(kind){
  const M = state.model; if (!M || !M.played) { setStatus(M && M.isDraft ? "Nothing to print yet. The draft edition prints once the draft is complete." : "Nothing to print yet. Pick a week with scores.", true); return; }
  const btns = [$("#dlPdf"), $("#dlImg"), $("#dl")]; btns.forEach(b=>b.disabled=true);
  setStatus("Warming up the presses…");
  try {
    const canvases = await renderPaper(kind === "img");
    const base = M.isDraft ? `${slug(gazetteName(M))}-draft-edition` : `${slug(gazetteName(M))}-week-${M.week}`;
    let res;
    if (kind === "img") {
      const blob = await new Promise(r=>canvases[0].toBlob(r, "image/png"));
      res = await deliverFile(blob, `${base}-front-page.png`);
    } else {
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({orientation:"portrait", unit:"pt", format:"letter"});
      canvases.forEach((c,i)=>{ if (i) doc.addPage("letter","portrait"); doc.addImage(c.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 612, 792); });
      res = await deliverFile(doc.output("blob"), `${base}.pdf`);
    }
    setStatus(res === "cancelled" ? "" : "Hot off the press. Send it to the league.");
    $("#dlMenu").hidden = true; $("#dl").setAttribute("aria-expanded","false");
  } catch(e) {
    setStatus(e && e.code === "declined" ? "Download cancelled." : ("The press jammed: " + ((e && e.message) || "unknown error")), e && e.code !== "declined");
  } finally { btns.forEach(b=>b.disabled=false); }
}

function buildDraft(raw){
  const {league, users, rosters} = raw, players = raw.players || {};
  const userById = Object.fromEntries((users||[]).map(u=>[u.user_id,u]));
  const teams = {};
  for (const r of rosters) { const u = userById[r.owner_id] || {}, ta = u.metadata && u.metadata.avatar;
    const avatar = ta && /^https:\/\//.test(ta) ? ta : u.avatar && /^[\w-]+$/.test(u.avatar) ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null;
    teams[r.roster_id] = {rid:r.roster_id, team:(u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, mgr:u.display_name || "an unclaimed roster", avatar}; }
  const n = rosters.length;
  const D = {isDraft:true, week:0, leagueId:league.league_id, leagueName:league.name, season:league.season, n, teams, played:false};
  const draft = raw.draft;

  if (A.kicker) rexP.push(`And ${A.kicker.team}. Round ${A.kicker.p.round}. A kicker. I don't have a joke. I'm just going to sit here with it.`);

    else if (A.homer) rexP.push(`And ${A.homer.t.team} drafted ${numw(A.homer.n)} ${NFLN[A.homer.nfl][1]}. That's not a fantasy team. That's a fan club.`);

function niceTicks(lo, hi, want = 6){

}

// push overlapping map circles apart; anything moved more than a few pixels gets a dot at its true spot and a thin line to it
function spreadMap(root){
  for (const plot of (root || document).querySelectorAll(".dmap-plot")) {
    plot.querySelectorAll(".mlead, .mtrue").forEach(e=>e.remove());
    const W = plot.clientWidth, H = plot.clientHeight; if (!W || !H) continue;
    const ms = [...plot.querySelectorAll(".mpt")];
    const P = ms.map((m,i) => { const x = +m.dataset.x/100*W, y = +m.dataset.y/100*H; return {m, x0:x, y0:y, x, y, r:(m.firstElementChild ? m.firstElementChild.offsetWidth : 28)/2 + 3, i}; });
    for (let it = 0; it < 120; it++) { let moved = false;
      for (let a = 0; a < P.length; a++) for (let b = a+1; b < P.length; b++) { const A = P[a], B = P[b];
        let dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy); const need = A.r + B.r;
        if (d >= need) continue;
        if (d < .01) { const ang = (a * 2.4 + b) % (2*Math.PI); dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
        const push = (need - d) / 2 + .2, ux = dx/d, uy = dy/d;
        A.x -= ux*push; A.y -= uy*push; B.x += ux*push; B.y += uy*push; moved = true; }
      for (const p of P) { p.x = Math.max(p.r - 3, Math.min(W - p.r + 3, p.x)); p.y = Math.max(p.r - 3, Math.min(H - p.r + 3, p.y)); }
      if (!moved) break; }
    for (const p of P) {
      p.m.style.left = p.x + "px"; p.m.style.top = p.y + "px";
      const dist = Math.hypot(p.x - p.x0, p.y - p.y0);
      if (dist > 5) {
        const dot = document.createElement("span"); dot.className = "mtrue"; dot.style.left = p.x0 + "px"; dot.style.top = p.y0 + "px";
        const ln = document.createElement("span"); ln.className = "mlead";
        Object.assign(ln.style, {left:p.x0 + "px", top:p.y0 + "px", width:dist + "px", transform:`rotate(${Math.atan2(p.y - p.y0, p.x - p.x0)}rad)`});
        plot.insertBefore(ln, plot.firstChild); plot.insertBefore(dot, plot.firstChild); }
    }
  }
}

function show(raw, week, isSample, variant = 0, anim){
  // same league, different week: turn the page. Anything else (new league, rewrite, reprint): print it.
  const prevLid = state.raw && state.model ? state.raw.league.league_id : null;
  const mode = anim || (prevLid === raw.league.league_id && state.week !== week ? (week > state.week ? "next" : "prev") : "print");
  fxStop();
  if (mode !== "none") fxToTop();
  const snap = (mode === "next" || mode === "prev") && !reduceMotion() ? {g: fxGeom(), clone: fxClone()} : null;
  if (prevLid !== raw.league.league_id && mode !== "print") state.stamped = false;
  state.raw = raw; state.sample = isSample;
  const ns0 = state.nflState;
  if (week === 0) { state.model = buildDraft(raw); state.edition = writeDraft(state.model, variant) || {notes:{}}; }
  else { state.model = buildModel(raw, week, {injFresh: isSample || !ns0 || week >= +ns0.week - 1}); state.edition = writeEdition(state.model, variant); }
  state.variant = variant; state.week = week;
  $("#share").hidden = isSample;
  const ns = state.nflState, day = new Date().getDay();
  state.early = week > 0 && !isSample && ns && +ns.week === week && (day===0 || day===1);
  render();
  if (mode === "print") fxPrint();
  else if (mode === "next" || mode === "prev") fxTurn(mode === "next" ? 1 : -1, snap);
}

async function loadLeague(id, week, variant = 0){
  const seq = ++state.loadSeq;
  $("#go").disabled = true;
  document.querySelectorAll("#paper .jmp").forEach(b => b.disabled = true);
  try {
    const raw = await fetchLeagueRaw(id, week, m=>{ if (seq === state.loadSeq) setStatus(m); });
    if (seq !== state.loadSeq) return;
    state.leagueId = id;
    show(raw, week, false, variant);
    setStatus(week === 0 ? `The draft edition of ${raw.league.name} is on the stands.` : `Week ${week} edition of ${raw.league.name} is on the stands.`);
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { if (seq === state.loadSeq) { $("#go").disabled = false; document.querySelectorAll("#paper .jmp").forEach(b => b.disabled = false); } }
}
