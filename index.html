<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Waiver Wire Gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: a dark "press room" control strip over a single tabloid front page — lead story + right rail, then game summaries, wire, power poll. Single deliberate newsprint look. */
:root{
  --desk:#2a2a2c; --press:#161617; --press-fg:#e9e7df; --press-muted:#9c9a92;
  --paper:#efeee8; --ink:#141414; --muted:#56544e; --tint:#e1dfd6; --red:#c3161c; --red-ink:#fff;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Press room */
.press{background:var(--press);color:var(--press-fg);padding-inline:16px;padding-block:14px;border-bottom:4px solid var(--red)}
.press-in{max-width:1180px;margin:0 auto;display:grid;gap:10px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;color:var(--press-muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--press-muted)}
.fld input,.fld select,.fld textarea{background:#232325;color:var(--press-fg);border:1px solid #3c3c3f;border-radius:3px;padding:9px 10px;min-width:0}
.fld textarea{min-height:84px;resize:vertical;width:100%}
#q{width:min(320px,80vw)}
#lg{max-width:min(320px,80vw)}
.btn{background:#2d2d30;color:var(--press-fg);border:1px solid #47474b;border-radius:3px;padding:9px 13px;cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.btn:hover{background:#38383c}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
#status{font-family:var(--mono);font-size:12px;color:var(--press-muted);min-height:1.2em}
#status.err{color:#ff8a80}
.settings{border-top:1px solid #333;padding-top:10px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.settings p{margin:0;font-size:12.5px;color:var(--press-muted);font-family:var(--mono);line-height:1.5}

/* Paper */
.desk{padding-inline:16px;padding-block:22px 48px}
.paper{max-width:1180px;margin:0 auto;background:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.45);padding:clamp(14px,3vw,34px)}
.banner{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:8px 12px;margin-bottom:14px}
.banner b{color:#ff6b62}

.flag{border-bottom:6px double var(--ink);padding-bottom:10px;display:grid;gap:6px}
.flag-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:6px}
.masthead{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.005em;font-size:clamp(46px,9.5vw,128px);text-wrap:balance;margin:6px 0 2px}
.flag-sub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;align-items:center}
.flag-sub .ed{background:var(--red);color:var(--red-ink);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px}
.flag-sub .tag{font-style:italic;color:var(--muted)}

/* Ticker */
.ticker{display:flex;gap:0;overflow-x:auto;border-bottom:3px solid var(--ink);margin-bottom:18px;scrollbar-width:thin}
.tk{flex:0 0 auto;padding:8px 14px;border-right:1px solid #bdbab0;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:grid;gap:2px;min-width:190px}
.tk .fin{font-size:10px;letter-spacing:.14em;color:var(--red);font-weight:600}
.tk .ln{display:flex;justify-content:space-between;gap:10px}
.tk .ln span:first-child{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .w{font-weight:600}

.front{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:28px}
@media (max-width:880px){.front{grid-template-columns:minmax(0,1fr)}}

.kicker{display:inline-block;background:var(--red);color:var(--red-ink);font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:1px 8px 0}
.lead h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.88;margin:10px 0 10px;text-wrap:balance;font-size:clamp(40px,6.6vw,86px)}
.lead h1.long{font-size:clamp(34px,5.2vw,66px)}
.dek{font-size:clamp(18px,2vw,22px);line-height:1.3;font-style:italic;margin:0 0 12px;text-wrap:balance}
.byline{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:6px 0;margin-bottom:14px}

.bigscore{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;border:3px solid var(--ink);margin-bottom:16px;position:relative;overflow:hidden}
.bigscore::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--ink) 1px,transparent 1.4px);background-size:7px 7px;opacity:.1;pointer-events:none}
.bs-side{padding:12px 14px;display:grid;gap:2px;min-width:0;position:relative}
.bs-side.r{text-align:right}
.bs-team{font-family:var(--display);font-weight:800;font-size:clamp(17px,2.2vw,24px);text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.bs-mgr{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bs-pts{font-family:var(--display);font-weight:900;font-size:clamp(40px,6vw,72px);line-height:.9;font-variant-numeric:tabular-nums}
.bs-side.win .bs-pts{color:var(--red)}
.bs-mid{background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.2em;padding:8px 6px;font-size:14px;text-align:center;position:relative}

.cols{columns:2 280px;column-gap:26px;column-rule:1px solid #bdbab0}
.story p{margin:0 0 .8em;font-size:16.5px;line-height:1.55;hyphens:auto}
.story p:first-child::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:4.1em;line-height:.8;padding:4px 6px 0 0;color:var(--red)}
.lead .next{font-family:var(--mono);font-size:12px;border-top:1px solid var(--ink);padding-top:8px;margin-top:6px}

/* Rail */
.rail{display:grid;gap:22px;align-content:start;min-width:0}
.box h3,.sec-h{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.02em;margin:0 0 8px;border-bottom:3px solid var(--ink);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h3 small,.sec-h small{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.12em;color:var(--muted)}
.award{display:grid;gap:1px;padding:8px 0;border-bottom:1px solid #bdbab0}
.award .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.award .who{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;line-height:1.02}
.award .why{font-size:14px;line-height:1.4;color:var(--muted)}
table.stand{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.stand th{text-align:right;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding:4px 3px}
.stand td{text-align:right;padding:5px 3px;border-bottom:1px solid #d3d0c6}
.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.stand td:nth-child(2){max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body);font-weight:600;font-size:13.5px}
.stand tr.cut td{border-bottom:2px solid var(--red)}
.hot{background:var(--ink);color:var(--paper);padding:14px 16px}
.hot h3{border-color:var(--paper);color:var(--paper)}
.hot h3 small{color:#bdbab0}
.hot .hh{font-family:var(--display);font-weight:800;font-size:25px;text-transform:uppercase;line-height:1;margin:4px 0 8px;text-wrap:balance}
.hot p{margin:0 0 .7em;font-size:15px;line-height:1.5}

/* Games */
.section{margin-top:30px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:26px 28px}
.game{display:grid;gap:8px;align-content:start;border-top:3px solid var(--ink);padding-top:10px;min-width:0}
.game h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,3vw,33px);line-height:.92;margin:2px 0 0;text-wrap:balance}
.game .dek{font-size:16.5px;margin:0}
.box-score{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;background:var(--tint);padding:8px 10px;display:grid;gap:6px}
.bx-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.bx-h span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx-h.w span:last-child{color:var(--red)}
.bx-p{display:flex;justify-content:space-between;gap:10px;color:var(--muted);padding-left:10px}
.bx-p span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .story p{font-size:15.5px}
.game .story p:first-child::first-letter{font-size:3.2em}

/* Wire + power */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.wire-item{padding:8px 0;border-bottom:1px solid #bdbab0;font-size:15px;line-height:1.45}
.wire-item b.t{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red);display:block}
.pp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid #bdbab0}
.pp .n{font-family:var(--display);font-weight:900;font-size:28px;line-height:1;min-width:1.4em}
.pp .t{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.pp .r{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pp .q{grid-column:2 / 4;font-size:14px;color:var(--muted);font-style:italic}
.empty{font-style:italic;color:var(--muted)}
.foot{margin-top:30px;border-top:6px double var(--ink);padding-top:10px;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.nogames{padding:40px 0;text-align:center}
.nogames h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,80px);text-transform:uppercase;margin:0}
.ai-mark{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
/* Printed newspaper pages (rendered off-screen, then photographed into a PDF/PNG) */
.np-host{position:absolute;left:-30000px;top:0;width:1275px;--np-paper:#f3efe4;--np-ink:#141210;--np-mute:#5a554b;--np-red:#b3141a;--np-rule:#27231d}
.np-page{width:1275px;height:1650px;overflow:hidden;background:var(--np-paper);color:var(--np-ink);font-family:var(--body);--fs:15px}
.np-in{padding:52px 58px 40px;display:flex;flex-direction:column;gap:14px}
.np-top{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;align-items:center;gap:18px;border-bottom:1px solid var(--np-rule);padding-bottom:6px}
.np-ear{border:2px solid var(--np-ink);padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.np-ear b{font-family:var(--body);font-size:16px;text-transform:none;letter-spacing:0;line-height:1.15}
.np-ear.r{text-align:right}
.np-mastwrap{overflow:hidden;text-align:center}
.np-mast{font-family:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;font-size:118px;line-height:1.05;white-space:nowrap;display:inline-block;max-width:none}
.np-date{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.1em;border-top:4px double var(--np-rule);border-bottom:4px double var(--np-rule);padding:6px 2px;margin-top:-8px}
.np-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-bottom:2px solid var(--np-ink)}
.np-sc{padding:4px 10px 6px;border-right:1px solid #b9b2a2;font-family:var(--mono);font-size:12.5px}
.np-sc div{display:flex;justify-content:space-between;gap:8px}
.np-sc div span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sc .w{font-weight:600}
.np-fin{color:var(--np-red);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.np-front{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px}
.np-lead{display:flex;flex-direction:column;gap:10px;min-width:0}
.np-kick{align-self:flex-start;background:var(--np-red);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px 1px}
.np-h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:78px;line-height:.9;margin:0;letter-spacing:-.005em}
.np-h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:calc(var(--fs)*2.3);line-height:.93;margin:0}
.np-dek{font-style:italic;font-size:22px;line-height:1.28}
.np-dek.sm{font-size:calc(var(--fs)*1.15)}
.np-by{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--np-mute);border-top:1px solid var(--np-rule);border-bottom:1px solid var(--np-rule);padding:5px 0}
.np-big{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);border:3px solid var(--np-ink)}
.np-big>div{padding:8px 12px;display:flex;flex-direction:column}
.np-big .t{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.np-big .p{font-family:var(--display);font-weight:900;font-size:62px;line-height:.95}
.np-big .win .p{color:var(--np-red)}
.np-big .r{font-family:var(--mono);font-size:12px;color:var(--np-mute)}
.np-big .rt{text-align:right}
.np-big .mid{background:var(--np-ink);color:var(--np-paper);font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;align-items:center;justify-content:center;padding:4px}
.np-body{font-size:var(--fs);line-height:1.45;text-align:justify;hyphens:auto}
.np-body p{margin:0 0 .6em}
.np-drop{font-family:var(--display);font-weight:900;float:left;font-size:3.6em;line-height:.8;padding:4px 6px 0 0;color:var(--np-red)}
.np-cols3{column-count:3;column-gap:22px;column-rule:1px solid #b9b2a2}
.np-cols2{column-count:2;column-gap:18px;column-rule:1px solid #b9b2a2}
.np-next{font-family:var(--mono);font-size:12px;border-top:1px solid var(--np-rule);padding-top:6px}
.np-rail{border-left:1px solid var(--np-rule);padding-left:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.np-sec{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;border-bottom:3px solid var(--np-ink);padding-bottom:2px;margin-top:6px}
.np-sec small{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.1em;color:var(--np-mute)}
.np-sec.inv{background:var(--np-ink);color:var(--np-paper);border:0;padding:4px 8px}
.np-aw{border-bottom:1px solid #b9b2a2;padding:3px 0 5px}
.np-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--np-red);font-weight:600}
.np-who{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05}
.np-why{font-size:12.5px;line-height:1.3;color:var(--np-mute)}
.np-tab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.np-tab th{text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--np-ink);padding:2px}
.np-tab td{text-align:right;padding:3px 2px;border-bottom:1px solid #d3ccbb}
.np-tab th:nth-child(2),.np-tab td:nth-child(2){text-align:left}
.np-tab td:nth-child(2){font-family:var(--body);font-weight:600;font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tab tr.cut td{border-bottom:2px solid var(--np-red)}
.np-inside{margin-top:auto;border-top:4px double var(--np-rule);padding-top:6px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.np-run{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;border-bottom:4px double var(--np-rule);padding-bottom:6px}
.np-run span:first-child{font-family:"UnifrakturMaguntia",Georgia,serif;font-size:22px;text-transform:none;letter-spacing:0}
.np-games{display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
.np-game{display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--np-ink);padding-top:8px;min-width:0}
.np-box{background:#e6e0d1;padding:6px 9px;font-family:var(--mono);font-size:calc(var(--fs)*.8);display:flex;flex-direction:column;gap:2px}
.np-bxh{display:flex;justify-content:space-between;font-weight:600}
.np-bxh.w span:last-child{color:var(--np-red)}
.np-bxp{display:flex;justify-content:space-between;color:var(--np-mute);padding-left:10px}
.np-back{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px}
.np-hot{border:3px solid var(--np-ink);padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.np-hot .np-sec.inv{margin:0 -14px}
.np-wire{font-size:calc(var(--fs)*.95);line-height:1.4;border-bottom:1px solid #b9b2a2;padding:6px 0}
.np-wire b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--np-red)}
.np-pp{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;border-bottom:1px solid #b9b2a2;padding:6px 0}
.np-pp .n{font-family:var(--display);font-weight:900;font-size:32px;line-height:1}
.np-pp .t{font-family:var(--display);font-weight:800;font-size:calc(var(--fs)*1.3);text-transform:uppercase;line-height:1.05}
.np-pp .q{font-size:calc(var(--fs)*.85);color:var(--np-mute);font-style:italic}
.np-foot{margin-top:auto;border-top:4px double var(--np-rule);padding-top:6px;font-family:var(--mono);font-size:11px;color:var(--np-mute);text-align:center}
.dl-menu{display:flex;flex-wrap:wrap;gap:8px}
.np-teasers{border-top:3px solid var(--np-ink);padding-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.np-teasers .hd{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--np-mute)}
.np-tz{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid #b9b2a2;padding-bottom:6px}

<script>
(() => {
"use strict";
const API = "https://api.sleeper.app/v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2 = n => (Math.round((+n||0)*100)/100).toFixed(2);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function hash(s){ let h=2166136261; for (const c of String(s)) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed|0; return () => { a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r,arr) => arr[Math.floor(r()*arr.length)];
const ord = n => n + (["th","st","nd","rd"][((n%100)-20)%10] || ["th","st","nd","rd"][n%100] || "th");
const lastName = n => { const parts=String(n||"").split(" ").filter(p=>!/^(jr\.?|sr\.?|ii|iii|iv|v)$/i.test(p)); return parts[parts.length-1] || n; };
const recStr = r => r ? `${r.w}-${r.l}${r.t?"-"+r.t:""}` : "0-0";
const ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],FLEX:["RB","WR","TE"],WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],DL:["DL","DE","DT"],LB:["LB"],DB:["DB","CB","S"],IDP_FLEX:["DL","DE","DT","LB","DB","CB","S"]};
const STAFF = ["Chip Waverly, Senior Gridiron Correspondent","Dot Halloran, Waiver Wire Bureau","Rex Pemberton III, Chief Hot Take Officer","Marge Kowalski, Lineup Desk","Buzz Ferrante, Late Window Reporter","Tip O'Rourke, Box Score Beat"];

/* ---------------- Sleeper data ---------------- */
async function getJSON(path, base){
  let r;
  try { r = await fetch((base || API) + path); }
  catch(e){ const err = new Error("network"); err.network = true; throw err; }
  if (!r.ok) throw new Error(`Sleeper returned ${r.status} for ${path}`);
  return r.json();
}
async function loadPlayers(){
  const cached = store.get("wwg_players_v2");
  if (cached) { try { const o = JSON.parse(cached); if (Date.now()-o.t < 864e5) return o.p; } catch(e){} }
  const raw = await getJSON("/players/nfl");
  const p = {};
  for (const [id,v] of Object.entries(raw||{})) {
    if (!v) continue;
    const name = v.full_name || [v.first_name,v.last_name].filter(Boolean).join(" ");
    p[id] = [name, v.position || (v.fantasy_positions||[])[0] || "", v.team || "", v.injury_status || ""];
  }
  store.set("wwg_players_v2", JSON.stringify({t:Date.now(), p}));
  return p;
}
function projKey(league){
  const rec = league.scoring_settings && league.scoring_settings.rec != null ? +league.scoring_settings.rec : 1;
  return rec >= 1 ? "pts_ppr" : rec >= 0.5 ? "pts_half_ppr" : "pts_std";
}
// Unofficial Sleeper projections feed. If it ever breaks, projection-based stories quietly drop out.
async function loadProjections(season, week, key){
  const pos = ["QB","RB","WR","TE","K","DEF"].map(p=>"position[]="+p).join("&");
  const data = await getJSON(`/projections/nfl/${season}/${week}?season_type=regular&${pos}`, "https://api.sleeper.app");
  const rows = Array.isArray(data) ? data : Object.entries(data||{}).map(([player_id,stats])=>({player_id, stats}));
  const out = {};
  for (const row of rows) {
    const s = row && row.stats || {};
    const v = s[key] ?? s.pts_ppr ?? s.pts_half_ppr ?? s.pts_std;
    if (row && row.player_id != null && v != null && isFinite(+v)) out[row.player_id] = +v;
  }
  if (!Object.keys(out).length) throw new Error("no projections");
  return out;
}
async function fetchLeagueRaw(id, week, status){
  status(`Pulling league ${id}…`);
  const [league, users, rosters] = await Promise.all([getJSON(`/league/${id}`), getJSON(`/league/${id}/users`), getJSON(`/league/${id}/rosters`)]);
  if (!league) throw new Error(`No Sleeper league found with ID ${id}.`);
  status(`Pulling box scores and transactions through week ${week}…`);
  const weeks = {}, txnsByWeek = {};
  const upto = Math.min(week+1, 18);
  await Promise.all(Array.from({length:upto},(_,i)=>i+1).map(async w => {
    weeks[w] = await getJSON(`/league/${id}/matchups/${w}`).catch(()=>[]);
    if (w <= week) txnsByWeek[w] = await getJSON(`/league/${id}/transactions/${w}`).catch(()=>[]);
  }));
  status("Pulling projections and the injury report…");
  const key = projKey(league), proj = {};
  await Promise.all([week, week-1].filter(w=>w>=1).map(async w => { try { proj[w] = await loadProjections(league.season, w, key); } catch(e){} }));
  const players = await loadPlayers().catch(()=>({}));
  return {league, users: users||[], rosters: rosters||[], weeks, txnsByWeek, proj, players};
}

/* ---------------- Model + story angles ---------------- */
const INJURED = new Set(["Out","IR","PUP","Doubtful"]);
function buildModel(raw, week, opts = {}){
  const {league, users, rosters, weeks, players} = raw;
  const txnsByWeek = raw.txnsByWeek || {};
  const proj = (raw.proj || {})[week] || null;
  const userById = Object.fromEntries(users.map(u=>[u.user_id,u]));
  const teams = {};
  for (const r of rosters) {
    const u = userById[r.owner_id] || {};
    teams[r.roster_id] = {rid:r.roster_id, team:(u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, mgr:u.display_name || "an unclaimed roster"};
  }
  const tname = rid => (teams[rid] || {}).team || "?";
  const slots = (league.roster_positions||[]).filter(s=>!["BN","IR","TAXI"].includes(s));
  const P = id => {
    const p = players[id];
    if (p) return {name:p[0], pos:p[1], nfl:p[2], inj:p[3] || ""};
    const isDef = /^[A-Z]{2,3}$/.test(id);
    return {name: isDef ? `${id} D/ST` : `Player ${id}`, pos: isDef ? "DEF" : "", nfl: isDef ? id : "", inj:""};
  };
  const pairs = w => {
    const by = {};
    for (const m of (weeks[w]||[])) { if (m.matchup_id == null) continue; (by[m.matchup_id] = by[m.matchup_id] || []).push(m); }
    return Object.entries(by).filter(([,a])=>a.length===2).map(([id,a])=>({id:+id, a:a[0], b:a[1]}));
  };
  const po = league.settings && +league.settings.playoff_week_start || 0;
  const medianOn = !!(league.settings && +league.settings.league_average_match === 1);
  const medianFor = w => {
    if (!medianOn || (po && w >= po)) return null;
    const sc = pairs(w).flatMap(g=>[[g.a.roster_id,+g.a.points||0],[g.b.roster_id,+g.b.points||0]]);
    if (!sc.length || sc.every(([,p])=>p===0)) return null;
    const s = sc.map(x=>x[1]).sort((a,b)=>a-b), k = s.length;
    const med = k%2 ? s[(k-1)/2] : (s[k/2-1]+s[k/2])/2;
    const res = {};
    for (const [rid,p] of sc) res[rid] = p>med ? "W" : p<med ? "L" : "T";
    return {med, res};
  };

  // Season-to-date records, scores, margins, standings positions
  const rec = {}, scores = {};
  for (const rid in teams) { rec[rid] = {w:0,l:0,t:0,pf:0,pa:0,res:[]}; scores[rid] = {}; }
  const rankOf = R => Object.fromEntries(Object.keys(teams)
    .sort((a,b)=>(R[b].w+R[b].t/2)-(R[a].w+R[a].t/2) || R[b].pf-R[a].pf).map((rid,i)=>[rid,i+1]));
  const margins = [];
  let before = null, rankBefore = null, seasonHigh = null, seasonLow = null;
  for (let w=1; w<=week; w++) {
    if (w === week) { before = JSON.parse(JSON.stringify(rec)); rankBefore = rankOf(rec); }
    const md = medianFor(w);
    if (md) for (const [rid,x] of Object.entries(md.res)) { const T = rec[rid]; if (!T) continue; if (x==="W") T.w++; else if (x==="L") T.l++; else T.t++; }
    for (const g of pairs(w)) {
      const pa = +g.a.points||0, pb = +g.b.points||0;
      if (pa===0 && pb===0) continue;
      const A = rec[g.a.roster_id], B = rec[g.b.roster_id];
      if (!A || !B) continue;
      A.pf+=pa; A.pa+=pb; B.pf+=pb; B.pa+=pa;
      scores[g.a.roster_id][w] = pa; scores[g.b.roster_id][w] = pb;
      margins.push(Math.abs(pa-pb));
      if (pa>pb){A.w++;B.l++;A.res.push("W");B.res.push("L");}
      else if (pb>pa){B.w++;A.l++;B.res.push("W");A.res.push("L");}
      else {A.t++;B.t++;A.res.push("T");B.res.push("T");}
      for (const [m,rid] of [[pa,g.a.roster_id],[pb,g.b.roster_id]]) {
        if (!seasonHigh || m > seasonHigh.pts) seasonHigh = {pts:m, rid, week:w};
        if (m > 0 && (!seasonLow || m < seasonLow.pts)) seasonLow = {pts:m, rid, week:w};
      }
    }
  }
  const rankAfter = rankOf(rec);
  const weekMedian = medianFor(week);
  const streakOf = res => { if (!res || !res.length) return {k:"",n:0}; const k = res[res.length-1]; let n=0; for (let i=res.length-1;i>=0&&res[i]===k;i--) n++; return {k,n}; };

  // Who acquired whom, and who used to roster whom (this season)
  const acq = {}, formerOwners = {};
  for (let w=1; w<=week; w++) for (const t of (txnsByWeek[w]||[])) {
    if (t.status !== "complete") continue;
    for (const [pid,rid] of Object.entries(t.drops||{})) (formerOwners[pid] = formerOwners[pid] || {})[rid] = t.type === "trade" ? "trade" : "cut";
    for (const [pid,rid] of Object.entries(t.adds||{})) acq[pid] = {rid:+rid, type:t.type, week:w};
  }

  const detail = m => {
    const pp = m.players_points || {};
    const raw = m.starters || [];
    const emptySlots = raw.filter(id=>!id || id==="0").length;
    const starters = raw.map((id,i)=>({id, slot:slots[i]||"", pts:+((m.starters_points && m.starters_points[i]) ?? pp[id] ?? 0), proj: proj ? (proj[id] ?? null) : null, ...P(id)})).filter(s=>s.id && s.id!=="0");
    const sset = new Set(raw);
    const bench = (m.players||[]).filter(id=>!sset.has(id)).map(id=>({id, pts:+(pp[id]||0), proj: proj ? (proj[id] ?? null) : null, ...P(id)}));
    let tb = null, hb = null; // true blunder (projections favored the bench guy) / hindsight
    for (const b of bench) for (const s of starters) {
      const el = ELIG[s.slot];
      if (el ? !el.includes(b.pos) : s.pos !== b.pos) continue;
      const gain = b.pts - s.pts;
      if (gain <= 0) continue;
      const edge = (b.proj != null && s.proj != null) ? b.proj - s.proj : null;
      if (edge != null && edge >= 3 && (!tb || gain > tb.gain)) tb = {b, s, gain, edge};
      if (!hb || gain > hb.gain) hb = {b, s, gain, edge};
    }
    const sorted = [...starters].sort((x,y)=>y.pts-x.pts);
    const tp = proj ? starters.reduce((a,s)=>a+(s.proj||0),0) : null;
    return {pts:+m.points||0, starters, bench, emptySlots, top:sorted.slice(0,3), best:sorted[0], worst:sorted[sorted.length-1], tb, hb, blunder: tb || hb, proj: tp};
  };

  const games = pairs(week).map(g => {
    let A = {...teams[g.a.roster_id], ...detail(g.a)}, B = {...teams[g.b.roster_id], ...detail(g.b)};
    if (B.pts > A.pts) [A,B] = [B,A];
    for (const S of [A,B]) {
      S.med = weekMedian ? weekMedian.res[S.rid] : null;
      S.before = before ? before[S.rid] : null;
      S.after = rec[S.rid];
      S.streak = streakOf(rec[S.rid].res);
      S.streakBefore = streakOf(before ? before[S.rid].res : []);
      S.rankBefore = rankBefore ? rankBefore[S.rid] : null;
      S.rankAfter = rankAfter[S.rid];
      S.prev = week > 1 ? scores[S.rid][week-1] : undefined;
    }
    return {id:g.id, W:A, L:B, tie:A.pts===B.pts, margin:A.pts-B.pts};
  });
  const sides = games.flatMap(g=>[g.W,g.L]);
  const played = sides.some(s=>s.pts>0);
  const n = sides.length;
  const sortedPts = sides.map(s=>s.pts).sort((a,b)=>b-a);
  for (const S of sides) { S.rank = sortedPts.indexOf(S.pts)+1; S.allPlay = sides.filter(o=>o!==S && o.pts < S.pts).length; }
  const numTeams = Object.keys(teams).length;
  const playoffLine = Math.min(numTeams, (league.settings && league.settings.playoff_teams) || Math.min(6, numTeams));

  // ---- Story angles: every candidate gets a newsworthiness score ----
  const share = (arr, fn) => arr.length ? arr.filter(fn).length / arr.length : 0;
  const injFresh = !!opts.injFresh;
  for (const g of games) {
    const {W, L} = g, m = g.margin, A = [];
    const add = (k, score, side, d = {}) => A.push({k, score, side, d});
    if (g.tie) add("tie", 95);
    else {
      if (m < 6) { const r = share(margins, x=>x > m); add("nailbiter", 38 + 47*r, "W", {closest: margins.every(x=>x >= m)}); }
      if (m >= 30) add("blowout", 18 + 40*share(margins, x=>x < m), "W", {widest: margins.every(x=>x <= m)});
      if (W.proj != null && L.proj != null && L.proj - W.proj >= 8) add("proj_upset", 42 + Math.min(45, (L.proj-W.proj)*1.3), "W", {gap:L.proj-W.proj});
      const thr = medianOn ? 3 : 2;
      if (week > 1 && W.before && L.before && L.before.w - W.before.w >= thr) add("record_upset", Math.min(72, 36 + 8*(L.before.w-W.before.w-thr+1)), "W");
      if (L.tb && L.tb.gain > m) add("true_blunder", 38 + Math.min(15, L.tb.edge*1.5) + Math.min(10, L.tb.gain/2), "L", {bl:L.tb});
      else if (L.hb && L.hb.gain > m && L.hb.gain >= 12) add("hindsight", 16 + Math.min(12, L.hb.gain/3), "L", {bl:L.hb});
      if (L.before && L.before.l===0 && L.before.t===0 && L.before.w>=2) add("unbeaten_falls", Math.min(78, 44 + 4*L.before.w), "L");
      if (L.streakBefore.k==="W" && L.streakBefore.n>=3) add("streak_snap", 34 + 5*L.streakBefore.n, "L", {n:L.streakBefore.n});
      if (W.streakBefore.k==="L" && W.streakBefore.n>=3) add("skid_over", 34 + 5*W.streakBefore.n, "W", {n:W.streakBefore.n});
      if (W.streak.k==="W" && W.streak.n>=3) add("streak_extend", Math.min(55, 18 + 5*W.streak.n), "W", {n:W.streak.n});
      if (week >= 3 && W.before && !W.before.res.includes("W")) add("first_win", 46, "W");
      if (W.prev != null && W.pts - W.prev >= 35) add("swing_up", 24 + Math.min(40, (W.pts-W.prev)/2), "W", {prev:W.prev, delta:W.pts-W.prev});
      if (L.prev != null && L.prev - L.pts >= 35) add("collapse", 24 + Math.min(40, (L.prev-L.pts)/2), "L", {prev:L.prev, delta:L.prev-L.pts});
      if (week > 1 && seasonHigh && seasonHigh.week===week && +seasonHigh.rid===+W.rid) add("season_high", 56, "W");
      if (week > 1 && seasonLow && seasonLow.week===week && +seasonLow.rid===+L.rid) add("season_low", 42, "L");
      if (n >= 6 && L.allPlay >= n-3) add("unlucky", 30 + 7*(L.allPlay-(n-4)), "L");
      if (n >= 6 && W.allPlay <= 2) add("lucky", 32 + 7*(3-W.allPlay), "W");
      // player-level angles
      const boom = W.starters.filter(p=>p.proj!=null && p.pts-p.proj >= 15).sort((a,b)=>(b.pts-b.proj)-(a.pts-a.proj))[0];
      if (boom) add("boom", 30 + Math.min(28, boom.pts-boom.proj) + (boom.pts-boom.proj > m ? 10 : 0), "W", {p:boom});
      else if (W.best && W.best.pts >= 35) add("boom", 28 + Math.min(25, W.best.pts-35), "W", {p:W.best});
      const bust = L.starters.filter(p=>p.proj!=null && p.proj>=12 && p.pts <= p.proj*0.35).sort((a,b)=>(b.proj-b.pts)-(a.proj-a.pts))[0];
      if (bust) add("bust", 28 + Math.min(22, bust.proj-bust.pts) + (bust.proj-bust.pts > m ? 10 : 0), "L", {p:bust});
      if (injFresh) {
        for (const [S,side] of [[L,"L"],[W,"W"]]) {
          const hurt = S.starters.filter(p=>INJURED.has(p.inj) && p.pts < Math.max(4, (p.proj||8)*0.5)).sort((a,b)=>(b.proj||0)-(a.proj||0))[0];
          if (hurt) add("injury", side==="L" ? 36 + ((hurt.proj||0)-hurt.pts > m ? 14 : 0) : 26, side, {p:hurt});
        }
      }
      for (const [S,side] of [[L,"L"],[W,"W"]]) {
        if (S.emptySlots) add("empty_slot", side==="L" ? 48 : 30, side, {k:S.emptySlots});
        else {
          const zero = S.starters.find(p=>p.pts===0 && !["K","DEF"].includes(p.pos) && (p.proj==null || p.proj < 1));
          if (zero && side==="L") add("zero_starter", 38, side, {p:zero});
        }
      }
      const rev = W.starters.filter(p=>formerOwners[p.id] && formerOwners[p.id][L.rid] && p.pts >= 10).sort((a,b)=>b.pts-a.pts)[0];
      if (rev) add("revenge", 50 + Math.min(20, rev.pts-10), "W", {p:rev, how:formerOwners[rev.id][L.rid]});
      const traded = W.starters.filter(p=>acq[p.id] && acq[p.id].rid===+W.rid && acq[p.id].type==="trade" && p.pts>=18).sort((a,b)=>b.pts-a.pts)[0];
      if (traded) add("trade_win", 30 + Math.min(15, traded.pts-18), "W", {p:traded, aw:acq[traded.id].week});
      const pickup = W.starters.filter(p=>acq[p.id] && acq[p.id].rid===+W.rid && acq[p.id].type!=="trade" && p.pts>=15 && p.pts>m).sort((a,b)=>b.pts-a.pts)[0];
      if (pickup) add("waiver_hero", 30 + Math.min(20, pickup.pts-15), "W", {p:pickup, aw:acq[pickup.id].week, how:acq[pickup.id].type});
      if (week > 1 && W.rankAfter===1 && W.rankBefore!==1) add("new_leader", 44, "W");
      if (week > 1 && L.rankBefore===1 && L.rankAfter!==1) add("dethroned", 44, "L");
      if (week > 1 && W.rankBefore<=3 && L.rankBefore<=3) add("titans", 30, "W");
      if (week > 2 && numTeams >= 8 && W.rankBefore >= numTeams-2 && L.rankBefore >= numTeams-2) add("basement", 24, "W");
    }
    if (!A.length) add("default", 10, "W");
    // Stakes: late regular season near the cut line, or playoffs
    const late = po && week < po && week >= po-3;
    g.bubble = late && [W,L].some(S=>Math.abs(S.rankAfter - playoffLine) <= 2);
    g.stakes = (g.bubble ? 12 : 0) + (po && week >= po ? 10 : 0);
    A.sort((a,b)=>b.score-a.score);
    g.angles = A;
  }

  // Lead + variety: don't run last week's lead angle again unless it's clearly the best story; no repeated angle types on one page
  const prevLead = !opts.light && week > 1 ? buildModel(raw, week-1, {light:true}).leadKind : null;
  const FAM = {true_blunder:"bench", hindsight:"bench", proj_upset:"upset", record_upset:"upset", streak_snap:"streak", skid_over:"streak", streak_extend:"streak", unbeaten_falls:"streak"};
  const fam = k => FAM[k] || k;
  const eff = (g, a) => a.score + g.stakes - (prevLead && fam(a.k) === fam(prevLead) ? 30 : 0);
  let lead = null, leadAngle = null;
  for (const g of games) for (const a of g.angles) if (!lead || eff(g,a) > eff(lead, leadAngle)) { lead = g; leadAngle = a; }
  const used = new Set();
  if (lead) { lead.primary = leadAngle; used.add(fam(leadAngle.k)); }
  const rest = games.filter(g=>g!==lead).sort((a,b)=>eff(b,b.angles[0]) - eff(a,a.angles[0]));
  for (const g of rest) {
    const fresh = g.angles.find(a=>!used.has(fam(a.k)) && a.score >= g.angles[0].score - 25);
    g.primary = fresh || g.angles[0];
    used.add(fam(g.primary.k));
  }
  for (const g of games) g.priority = eff(g, g.primary);
  if (opts.light) return {leadKind: leadAngle ? leadAngle.k : null};

  const nextOpp = {};
  for (const g of pairs(week+1)) { nextOpp[g.a.roster_id] = teams[g.b.roster_id]; nextOpp[g.b.roster_id] = teams[g.a.roster_id]; }

  // Awards
  const starters = sides.flatMap(S=>S.starters.map(p=>({...p, team:S.team})));
  const pow = starters.reduce((a,b)=>!a||b.pts>a.pts?b:a, null);
  const withProj = starters.filter(p=>p.proj!=null);
  const beat = withProj.length ? withProj.reduce((a,b)=>!a||(b.pts-b.proj)>(a.pts-a.proj)?b:a, null) : null;
  const bustA = withProj.filter(p=>p.proj>=10).reduce((a,b)=>!a||(b.proj-b.pts)>(a.proj-a.pts)?b:a, null);
  const dud = starters.filter(p=>!["K","DEF"].includes(p.pos)).reduce((a,b)=>!a||b.pts<a.pts?b:a, null);
  const tbs = sides.filter(S=>S.tb).map(S=>({...S.tb, team:S.team}));
  const hbs = sides.filter(S=>S.hb).map(S=>({...S.hb, team:S.team}));
  const blund = tbs.length ? {...tbs.reduce((a,b)=>b.gain>a.gain?b:a), real:true} : hbs.length ? {...hbs.reduce((a,b)=>b.gain>a.gain?b:a), real:false} : null;
  const losers = games.filter(g=>!g.tie).map(g=>g.L), winners = games.filter(g=>!g.tie).map(g=>g.W);
  const unlucky = losers.reduce((a,b)=>!a||b.pts>a.pts?b:a, null);
  const lucky = winners.reduce((a,b)=>!a||b.pts<a.pts?b:a, null);
  const top = sides.reduce((a,b)=>!a||b.pts>a.pts?b:a, null);

  const standings = Object.values(teams).map(t=>({...t, ...rec[t.rid], streak:streakOf(rec[t.rid].res)}))
    .sort((a,b)=>(b.w+b.t/2)-(a.w+a.t/2) || b.pf-a.pf);
  const maxPF = Math.max(1, ...standings.map(s=>s.pf));
  const weekPts = Object.fromEntries(sides.map(S=>[S.rid,S.pts]));
  const maxWk = Math.max(1, ...Object.values(weekPts));
  const power = standings.map(s=>{ const gp = s.w+s.l+s.t || 1; return {...s, wk:weekPts[s.rid]||0, score: 0.5*((s.w+s.t/2)/gp) + 0.3*(s.pf/maxPF) + 0.2*((weekPts[s.rid]||0)/maxWk)}; }).sort((a,b)=>b.score-a.score);

  const wire = (txnsByWeek[week]||[]).filter(t=>t.status==="complete").map(t=>({
    type:t.type, bid:t.settings && t.settings.waiver_bid,
    adds:Object.entries(t.adds||{}).map(([pid,rid])=>({p:P(pid), team:tname(rid)})),
    drops:Object.entries(t.drops||{}).map(([pid,rid])=>({p:P(pid), team:tname(rid)}))
  }));

  return {
    leagueId: league.league_id, leagueName: league.name || "Fantasy League", season: league.season, week, po,
    playoffs: !!(po && week >= po), hasProj: !!proj, prevLead,
    medianOn, median: weekMedian ? weekMedian.med : null, games, played, n, numTeams,
    awards:{pow, beat, bust:bustA, dud, blund, unlucky, lucky, top}, standings, power, playoffLine, wire, nextOpp
  };
}

/* ---------------- The writers' room (built-in) ---------------- */
const an = v => /^(8\d?|11|18)(\.|$)/.test(String(v)) ? "an" : "a";
const poss = s => /s$/i.test(s) ? s + "'" : s + "'s";
const pname = p => p.pos === "DEF" ? `the ${p.name} defense` : p.name;
const Pname = p => { const s = pname(p); return s[0].toUpperCase() + s.slice(1); };
const plast = p => p.pos === "DEF" ? lastName(p.name) + " D" : lastName(p.name);

};

function writeGame(g, M, r, isLead){
  const {W,L} = g, hero = W.best || {name:"the lineup",pts:0,pos:"",nfl:""}, lhero = L.best || {name:"nobody",pts:0};
  const x = {g, W:W.team, L:L.team, ws:f2(W.pts), ls:f2(L.pts), mg:f2(g.margin), wk:M.week, n:M.n, hl:plast(hero)};
  const a = g.primary, T = ANG[a.k] || ANG.default;
  const headline = pick(r, T.heads(x, a));
  const dek = g.tie
    ? `Both teams leave Week ${M.week} at ${recStr(W.after)} and ${recStr(L.after)}, and nobody is happy about it`
    : `${hero.name} scores ${f2(hero.pts)}; ${W.team} now ${recStr(W.after)}, ${L.team} ${recStr(L.after)}`;
  const body = [T.lede(x, a, r)];
  if (W.top.length && !(a.k==="boom" && a.d.p && a.d.p.id===hero.id && W.top.length<2)) {
    let p = `${Pname(hero)} (${[hero.pos,hero.nfl].filter(Boolean).join(", ")}) ${pick(r,["led the way","did the heavy lifting","carried the load","was the difference"])} with ${f2(hero.pts)} points`;
    if (W.top[1]) p += `, and ${pname(W.top[1])} added ${f2(W.top[1].pts)}`;
    p += `. For ${L.team}, ${pname(lhero)} ${pick(r,["kept it respectable","refused to go quietly","was a lone bright spot","did not go quietly"])} with ${f2(lhero.pts)}.`;
    body.push(p);
  }
  // Secondary angles become supporting lines (different types, max 2 or 3 for the lead)
  const extra = [];
  const seen = new Set([a.k]);
  for (const b of g.angles) {
    if (extra.length >= (isLead ? 3 : 2)) break;
    if (seen.has(b.k) || b.score < 26) continue;
    if ((a.k==="true_blunder"||a.k==="hindsight") && (b.k==="true_blunder"||b.k==="hindsight")) continue;
    const s = (ANG[b.k]||ANG.default).line(x, b);
    if (s) { extra.push(s); seen.add(b.k); }
  }
  if (g.bubble) {
    const left = M.po - M.week;
    extra.push(`With the playoffs ${left} week${left>1?"s":""} away, ${W.team} sits ${ord(W.rankAfter)} and ${L.team} ${ord(L.rankAfter)}. The top ${M.playoffLine} get in.`);
  }
  if (M.median != null && !g.tie) {
    const wm = W.med, lm = L.med, md = f2(M.median);
    if (wm==="W" && lm==="W") extra.push(`Both teams cleared the league median of ${md}, so ${W.team} banks a 2-0 week and ${L.team} salvages a 1-1 split.`);
    else if (wm==="W") extra.push(`${W.team} also cleared the league median of ${md} for a clean 2-0 week; ${L.team} goes 0-2.`);
    else if (lm!=="W") extra.push(`Neither team reached the league median of ${md}, so ${W.team} settles for a 1-1 week and ${L.team} goes 0-2.`);
  }
  if (!g.tie) extra.push(`${W.team} ${M.median!=null?"is now":"moves to"} ${recStr(W.after)}; ${L.team} ${M.median!=null?"sits at":"drops to"} ${recStr(L.after)}.`);
  if (extra.length) body.push(extra.join(" "));
  const qL = [
    `“We'll look at the tape,” said a visibly shaken member of the ${L.team} front office, before declining to look at the tape.`,
    `“I set that lineup at 12:59,” a source close to ${L.team} admitted. “In hindsight, 12:58 was the move.”`,
    `Reached for comment, ${L.team} manager @${L.mgr} said only: “Next question.”`,
    `Sources say the ${L.team} group chat has been silent since the late window.`,
    `@${L.mgr} was last seen staring at the waiver wire with the lights off.`
  ];
  const qW = [
    `“We knew,” said @${W.mgr}. Asked what exactly they knew, the manager walked away from the podium.`,
    `“Process over results,” said @${W.mgr}, whose process this week was mostly ${pname(hero)}.`,
    `@${W.mgr} celebrated by ${pick(r,["refreshing the matchup screen 41 times","setting next week's lineup immediately","sending a single trophy emoji to the group chat"])}.`
  ];
  if (!g.tie) body.push(isLead ? `${pick(r,qW)} ${pick(r,qL)}` : pick(r, r()<.5 ? qW : qL));
  const next = !g.tie && M.nextOpp[W.rid] ? `Next week: ${W.team} vs. ${M.nextOpp[W.rid].team} · ${L.team} vs. ${(M.nextOpp[L.rid]||{}).team || "TBD"}` : "";
  return {id:g.id, kicker:(M.playoffs ? "Playoffs · " : "") + T.kicker, headline, dek, body, next};
}

function writeColumn(M, r){
  const lead = M.power[0], last = M.power[M.power.length-1];
  if (!lead || !last) return null;
  return {
    headline: pick(r,[`Stop pretending ${lead.team} isn't the team to beat`, `Somebody check on ${last.team}`]),
    body: [
      `After ${M.week} week${M.week>1?"s":""}, ${lead.team} sits at ${recStr(lead)} with ${f2(lead.pf)} points scored. You can call it luck. The standings don't.`,
      `Meanwhile, ${last.team} is ${recStr(last)} and has scored ${f2(last.pf)} points. The waiver wire is open every week, @${last.mgr}. We checked.`
    ]
  };
}

function writeEdition(M){
  const r = rng(hash(M.leagueId + ":" + M.week));
  const lead = [...M.games].sort((a,b)=>b.priority-a.priority)[0];
  const stories = {};
  for (const g of M.games) stories[g.id] = writeGame(g, M, rng(hash(M.leagueId+":"+M.week+":"+g.id)), g===lead);
  return {leadId: lead ? lead.id : null, stories, column: writeColumn(M, r), byline: pick(r, STAFF), ai:false};
}

function editionText(){

  const L = [`📰 ${M.leagueName.toUpperCase()} · WEEK ${M.week} FINAL`, ""];
  const ls = E.stories[E.leadId];
  if (ls) { L.push(`🔥 ${ls.headline.toUpperCase()}`, ls.dek, ""); }
  for (const g of M.games) L.push(`${g.W.team} ${f2(g.W.pts)} – ${g.L.team} ${f2(g.L.pts)}  |  ${E.stories[g.id].headline}`);
  const A = M.awards; L.push("");
  if (A.pow) L.push(`🏆 Player of the week: ${A.pow.name} (${f2(A.pow.pts)}, ${A.pow.team})`);
  if (A.blund) L.push(`🪑 ${A.blund.real?"Bench blunder":"Hindsight award"}: ${A.blund.team} left ${f2(A.blund.gain)} on the pine (${A.blund.b.name})`);
  if (A.unlucky) L.push(`💔 Unluckiest: ${A.unlucky.team}, ${f2(A.unlucky.pts)} in a loss`);
  if (A.bust && A.bust.proj - A.bust.pts >= 8) L.push(`💩 Bust: ${A.bust.name}, ${f2(A.bust.pts)} on a ${f2(A.bust.proj)} projection`); else if (A.dud) L.push(`💩 Dud: ${A.dud.name}, ${f2(A.dud.pts)}`);
  return L.join("\n");
}

  return new Promise((res,rej)=>{

  const back = `<div class="np-page"><div class="np-in">${run(lastPage,"Opinion · Power Poll · Transactions")}

        ${!trades.length&&!pickups.length?`<div class="np-wire"><i>A quiet week on the wire. Suspiciously quiet.</i></div>`:""}
      </div>

    <div class="np-foot">${esc(name)} · printed by the Waiver Wire Gazette press · quotes are satire, box scores are not · not affiliated with Sleeper</div>

}

function npFit(page){
  const inner = page.firstElementChild;
  const set = v => page.style.setProperty("--fs", v+"px");
  const fits = () => inner.scrollHeight <= NP_H;
  const mast = page.querySelector(".np-mast");
  if (mast) { let s = 118; mast.style.fontSize = s+"px"; while (mast.scrollWidth > mast.parentElement.clientWidth && s > 44) { s -= 3; mast.style.fontSize = s+"px"; } }
  const h1 = page.querySelector(".np-h1");
  if (h1) { let s = 84; h1.style.fontSize = s+"px"; while (h1.scrollHeight > 300 && s > 40) { s -= 3; h1.style.fontSize = s+"px"; } }
  let lo = 8, hi = 21;
  for (let k=0; k<10; k++) { const mid = (lo+hi)/2; set(mid); if (fits()) lo = mid; else hi = mid; }
  set(Math.floor(lo*4)/4);
}

async function renderPaper(onlyFront){
  await Promise.all([loadScript(LIBS.h2c), onlyFront ? null : loadScript(LIBS.pdf)]);

function slug(s){ return String(s).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "gazette"; }
async function deliverFile(blob, filename){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (dl) { await dl.save({filename, data:blob}); return "saved"; }
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return "shared"; } catch(e){ if (e && e.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return "saved";
}

function factsFor(M){
  const side = S => ({team:S.team, manager:"@"+S.mgr, points:+f2(S.pts), projected:S.proj!=null?+f2(S.proj):undefined, record_after:recStr(S.after), standings_place_after:S.rankAfter, week_rank:`${S.rank} of ${M.n}`, streak:S.streak.n?S.streak.k+S.streak.n:"",
    top_starters:S.top.map(p=>`${p.name} (${p.pos}${p.nfl?", "+p.nfl:""}) ${f2(p.pts)}${p.proj!=null?` (proj ${f2(p.proj)})`:""}`),
    next_opponent:(M.nextOpp[S.rid]||{}).team||null, vs_league_median:S.med||undefined});
  const A = M.awards;
  const angleText = (g, a) => {
    const x = {g, W:g.W.team, L:g.L.team, ws:f2(g.W.pts), ls:f2(g.L.pts), mg:f2(g.margin), wk:M.week, n:M.n, hl:g.W.best?plast(g.W.best):""};
    const T = ANG[a.k] || ANG.default;
    return `${T.kicker}: ${T.line(x,a) || T.lede(x,a,()=>0)}`;
  };
  return {
    league:M.leagueName, season:M.season, week:M.week, playoffs:M.playoffs,
    median_scoring: M.median!=null ? `ON: each week every team also plays the league median (${f2(M.median)} this week). Beat it = extra win, so a team can go 2-0, 1-1 or 0-2 in a week. Records below already include median games.` : "off",
    last_weeks_lead_angle: M.prevLead ? (ANG[M.prevLead]||{}).kicker : null,
    games:M.games.map(g=>({id:g.id, tie:g.tie, winner:side(g.W), loser:side(g.L), margin:+f2(g.margin),
      playoff_bubble:g.bubble||undefined,
      angles_ranked:g.angles.filter(a=>a.score>=20).slice(0,4).map(a=>angleText(g,a)),
      suggested_primary_angle:(ANG[g.primary.k]||ANG.default).kicker})),
    suggested_lead_game_id: [...M.games].sort((a,b)=>b.priority-a.priority)[0]?.id,
    awards:{player_of_week:A.pow&&`${A.pow.name} ${f2(A.pow.pts)} for ${A.pow.team}`, bust:A.bust&&`${A.bust.name} ${f2(A.bust.pts)} on proj ${f2(A.bust.proj)} for ${A.bust.team}`, unluckiest_loser:A.unlucky&&`${A.unlucky.team} ${f2(A.unlucky.pts)}`, luckiest_winner:A.lucky&&`${A.lucky.team} ${f2(A.lucky.pts)}`},
    standings:M.standings.map(s=>`${s.team} ${recStr(s)} PF ${f2(s.pf)}`),
    trades_this_week:M.wire.filter(t=>t.type==="trade").map(t=>t.adds.map(a=>`${a.team} gets ${a.p.name}`).join("; "))
  };
}
function promptFor(M, E, lore){
  return `You are the sports desk of a loud, gripping tabloid sports newspaper covering a private fantasy football league among friends. Write this week's edition.

VOICE: punchy tabloid headlines, vivid verbs, dramatic ledes, affectionate trash talk. Think back-page New York tabloid. Funny, never cruel; no jokes about anyone's real personal life, appearance, or identity.
FACTS: use ONLY the numbers, players, records and results in the data below. Never invent stats, injuries, or events. Injury statuses are current listings, so say a player "is now listed Out", not when or how he got hurt. You may invent obviously satirical anonymous quotes ("a source close to the team said...").
${lore ? `LEAGUE LORE (weave in where it fits naturally):\n${lore}\n` : ""}
STORY SELECTION: each game has "angles_ranked" (best first) computed from how unusual each storyline is in this league. Build each story around its strongest angle and weave in the others. Keep the page varied: give different games different angle types where you can, and avoid leading with the same angle type as last week ("last_weeks_lead_angle"). The suggested lead game is a good default; override it only if another game is clearly the bigger story. Bench decisions are only the story when an angle says so.

Reply with ONLY this JSON:
{"lead":{"id":<game id>,"kicker":"<1-3 word label>","headline":"<max 11 words>","dek":"<one sentence subhead>","body":["<4-5 paragraphs, 50-90 words each>"]},
 "games":[{"id":<game id>,"kicker":"<1-3 words>","headline":"<max 10 words>","dek":"<one sentence>","body":["<2-3 paragraphs, 40-70 words each>"]}],
 "column":{"headline":"<hot take headline>","body":["<2 short opinion paragraphs about the league's big picture>"]}}
"games" must include every game except the lead.

DATA:
${JSON.stringify(factsFor(M))}`;
}
async function aiWrite(){
  const M = state.model; if (!M || !M.played) return;
  const lore = $("#lore").value.trim();
  const prompt = promptFor(M, state.edition, lore);
  const btn = $("#ai"); btn.disabled = true;
  setStatus("Writers are on deadline. Claude is drafting the edition (this can take a minute)…");
  try {
    let out;
    if (state.sampleFn) {
      out = await state.sampleFn.json(prompt, {modelTier:"default"});
    } else {
      const key = $("#key").value.trim();
      if (!key) { openSettings(); setStatus("Add an Anthropic API key in Newsroom settings to have Claude write the edition.", true); return; }
      const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({model:$("#model").value.trim()||"claude-sonnet-5-5", max_tokens:8000, messages:[{role:"user", content:prompt}]})});
      const data = await r.json();
      if (!r.ok) throw {code:"api", message:(data.error && data.error.message) || ("HTTP "+r.status)};
      const text = (data.content||[]).map(c=>c.text||"").join("");
      out = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}")+1));
    }
    applyAI(out);
    setStatus("Edition rewritten by Claude. Hit “Print edition” to go back to the house style.");
  } catch(e) {
    const msg = {not_granted:"Claude access wasn't allowed for this page.", rate_limited:"Claude is busy. Try again in a bit.", invalid_json:"The writers filed a garbled story. Try again.", cancelled:"Stopped."}[e && e.code] || ("Claude couldn't write the edition: " + ((e && e.message) || "unknown error"));
    setStatus(msg, true);
    if (e && e.code === "not_granted") $("#ai").hidden = true;
  } finally { btn.disabled = false; }
}
function applyAI(out){
  const E = state.edition, ids = new Set(state.model.games.map(g=>g.id));
  const clean = s => ({kicker:String(s.kicker||"Final").slice(0,30), headline:String(s.headline||""), dek:String(s.dek||""), body:(Array.isArray(s.body)?s.body:[s.body]).filter(Boolean).map(String)});
  if (out && out.lead && ids.has(+out.lead.id) && out.lead.headline) {
    E.leadId = +out.lead.id;
    E.stories[E.leadId] = {...E.stories[E.leadId], ...clean(out.lead)};
  }
  for (const s of (out && out.games) || []) if (ids.has(+s.id) && s.headline) E.stories[+s.id] = {...E.stories[+s.id], ...clean(s)};
  if (out && out.column && out.column.headline) E.column = {headline:String(out.column.headline), body:(out.column.body||[]).map(String)};
  E.ai = true;
  render();
}

function sampleRaw(){
  const r = rng(20260928);
  const T = [["Casco Bay Crushers","harborhawk"],["Lobster Roll Dynasty","buoybrain"],["Fog City Fumbles","mistymike"],["Head Light Heroes","lighthousejen"],["Moose Crossing","bigmoose22"],["Whoopie Pie Warriors","sugarrush"],["Allagash Attack","hopsandpops"],["Nor'easter Nation","stormchaser"],["Bangor Bruisers","bangorbill"],["Acadia All-Stars","summitsue"]];
  const FIRST = ["Jalen","Marcus","Tre","Darius","Cole","Bryce","Malik","Devon","Isaiah","Caleb","Nico","Jaylen","Rashad","Tyler","Brock","Keenan","Amari","Drake","Quincy","Zay","Terrell","Omar","Luke","Dante","Kyler","Evan","Josh","Rico","Bo","Xavier"];
  const LAST = ["Holloway","Brightwater","Kingsley","Okafor","Maddox","Pruitt","Whitlock","Sandoval","Achebe","Lindqvist","Fairbanks","Culpepper","Dunmore","Ravenel","Tolliver","Mercer","Beaumont","Quarles","Stroud-Ellis","Vance","Hargrove","Oduya","Pembroke","Castellanos","Winslow","Ashby","Delacroix","Farrow","Gentry","Ibarra","Kessler","Montague","Northcutt","Pasternak","Redwine","Salcedo","Thornbury","Underwood","Valdez","Yardley"];
  const NFL = ["BUF","MIA","NYJ","NE","BAL","CIN","CLE","PIT","HOU","IND","JAX","TEN","DEN","KC","LV","LAC","DAL","NYG","PHI","WAS","CHI","DET","GB","MIN","ATL","CAR","NO","TB","ARI","LAR","SF","SEA"];
  const DEFN = {BUF:"Buffalo Bills",MIA:"Miami Dolphins",NYJ:"New York Jets",NE:"New England Patriots",BAL:"Baltimore Ravens",CIN:"Cincinnati Bengals",CLE:"Cleveland Browns",PIT:"Pittsburgh Steelers",HOU:"Houston Texans",IND:"Indianapolis Colts"};
  const players = {}, base = {}; let pid = 1;
  const used = new Set();
  const MEAN = {QB:[12,22],RB:[5,16],WR:[5,16],TE:[4,11],K:[7,9],DEF:[5,8]};
  const mk = pos => { let nm; do { nm = pick(r,FIRST)+" "+pick(r,LAST); } while (used.has(nm)); used.add(nm); const id="s"+(pid++); players[id]=[nm,pos,pick(r,NFL),""]; const [a,b]=MEAN[pos]; base[id]=a+(b-a)*r(); return id; };
  const defs = Object.keys(DEFN);
  const rosterPositions = ["QB","RB","RB","WR","WR","TE","FLEX","K","DEF","BN","BN","BN","BN","BN"];
  const users = [], rosters = [], L = {};
  T.forEach(([team,mgr],i) => {
    users.push({user_id:"u"+i, display_name:mgr, metadata:{team_name:team}});
    rosters.push({roster_id:i+1, owner_id:"u"+i});
    const d = defs[i]; players[d] = [DEFN[d],"DEF",d,""]; base[d] = 5+3*r();
    L[i+1] = {QB:[mk("QB"),mk("QB")], RB:[mk("RB"),mk("RB"),mk("RB"),mk("RB")], WR:[mk("WR"),mk("WR"),mk("WR"),mk("WR")], TE:[mk("TE"),mk("TE")], K:[mk("K")], DEF:[d]};
  });
  // A few storylines to exercise the engine: a Week 2 trade (so a revenge game can happen), waiver pickups, an injury, an empty slot
  const tradeA = L[3].WR[0], tradeB = L[7].RB[0];
  const pickupRB = mk("RB"), pickupWR = mk("WR");
  base[pickupRB] = 15; base[pickupWR] = 13;
  const hurt = L[2].RB[0]; players[hurt][3] = "Out";
  const txnsByWeek = {
    1: [{status:"complete", type:"waiver", adds:{[pickupWR]:9}, drops:{[L[9].WR[3]]:9}, settings:{waiver_bid:12}}],
    2: [{status:"complete", type:"trade", adds:{[tradeA]:7, [tradeB]:3}, drops:{[tradeA]:3, [tradeB]:7}, settings:{}},
        {status:"complete", type:"waiver", adds:{[pickupRB]:5}, drops:{[L[5].RB[3]]:5}, settings:{waiver_bid:37}}],
    3: [{status:"complete", type:"free_agent", adds:{[mk("K")]:2}, drops:{}, settings:{}}]
  };
  const n = 10, ids = [...Array(n)].map((_,i)=>i+1), weeks = {}, proj = {};
  for (let w=1; w<=4; w++) {
    if (w===2) { L[3].WR[0] = tradeB; L[7].RB[0] = tradeA; L[5].RB[3] = pickupRB; L[9].WR[3] = pickupWR; }
    if (w===3) { L[9].WR[3] = pickupWR; }
    proj[w] = {};
    const rot = [ids[0], ...ids.slice(1).map((_,k,arr)=>arr[(k+w-1)%arr.length])];
    const list = [];
    for (let k=0;k<n/2;k++) {
      for (const rid of [rot[k], rot[n-1-k]]) {
        const R = L[rid], all = [...R.QB,...R.RB,...R.WR,...R.TE,...R.K,...R.DEF];
        const pp = {};
        for (const id of all) {
          const pj = Math.round(base[id]*(0.85+0.3*r())*100)/100;
          proj[w][id] = pj;
          let v = pj * (0.1 + 1.9*Math.pow(r(), 1.1)) + (players[id][1]==="DEF" ? -3 + 4*r() : 0);
          if (id === hurt && w === 3) v = 1.4;
          pp[id] = w <= 3 ? Math.round(v*100)/100 : 0;
        }
        const flexPick = r()<.5 ? R.RB[2] : R.WR[2];
        let starters = [R.QB[0],R.RB[0],R.RB[1],R.WR[0],R.WR[1],R.TE[0],flexPick,R.K[0],R.DEF[0]];
        if (w===2 && rid===8) starters[5] = "0";
        const sp = starters.map(id=>id==="0"?0:pp[id]);
        list.push({roster_id:rid, matchup_id:k+1, starters, starters_points:sp, players:all, players_points:pp, points:Math.round(sp.reduce((a,b)=>a+b,0)*100)/100});
      }
    }
    weeks[w] = list;
  }
  return {league:{league_id:"sample", name:"The Sample League", season:"2026", roster_positions:rosterPositions, scoring_settings:{rec:1}, settings:{playoff_week_start:15, playoff_teams:6, league_average_match:1}}, users, rosters, weeks, txnsByWeek, proj, players};
}

const state = {model:null, edition:null, sample:true, early:false, sampleFn:null, raw:null, leagueId:null, nflState:null};
function setStatus(msg, err){ const s=$("#status"); s.textContent = msg||""; s.classList.toggle("err", !!err); }

const wkSel = $("#wk");

function defaultWeek(ns){
  if (!ns) return 3;
  const cur = +ns.week || 1, day = new Date().getDay(); // 0 Sun … 6 Sat
  if (ns.season_type !== "regular" && ns.season_type !== "post") return Math.max(1, Math.min(18, cur||1));
  return Math.max(1, Math.min(18, (day===1||day===2) ? cur : cur-1));
}

function show(raw, week, isSample){
  state.raw = raw; state.sample = isSample;

    try { const u = new URL(location.href); u.searchParams.set("league", id); u.searchParams.set("week", week); history.replaceState(null,"",u); } catch(e){}
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { $("#go").disabled = false; }
}

async function resolveInput(){
  const q = $("#q").value.trim();
  const week = +wkSel.value;
  if (!q) { setStatus("Enter a Sleeper username or league ID.", true); return; }
  if (/^\d{9,}$/.test(q)) { $("#lgWrap").hidden = true; return loadLeague(q, week); }
  $("#go").disabled = true;
  try {
    setStatus(`Looking up @${q}…`);
    const user = await getJSON(`/user/${encodeURIComponent(q)}`);
    if (!user || !user.user_id) throw new Error(`No Sleeper user named “${q}”. Check the spelling, or paste a league ID instead.`);
    const season = (state.nflState && state.nflState.season) || String(new Date().getFullYear());
    let leagues = await getJSON(`/user/${user.user_id}/leagues/nfl/${season}`) || [];
    if (!leagues.length) throw new Error(`@${q} has no ${season} NFL leagues on Sleeper.`);
    const sel = $("#lg"); sel.innerHTML = "";
    leagues.forEach(l=>sel.add(new Option(l.name, l.league_id)));
    $("#lgWrap").hidden = leagues.length < 2;
    $("#go").disabled = false;
    return loadLeague(leagues[0].league_id, week);
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { $("#go").disabled = false; }
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  if (state.sample && !$("#q").value.trim()) { show(state.raw, +wkSel.value > 3 ? 3 : +wkSel.value, true); setStatus("Showing the sample league. Enter your username or league ID to print yours."); return; }
  if (!$("#lgWrap").hidden && state.leagueId && $("#q").value.trim() && !/^\d{9,}$/.test($("#q").value.trim()) && $("#lg").value) return loadLeague($("#lg").value, +wkSel.value);
  resolveInput();
});
$("#lg").addEventListener("change", () => loadLeague($("#lg").value, +wkSel.value));
$("#more").addEventListener("click", () => { const s=$("#settings"); s.hidden=!s.hidden; $("#more").setAttribute("aria-expanded", String(!s.hidden)); });
$("#lore").addEventListener("input", e => { if (e.target.dataset.key) store.set(e.target.dataset.key, e.target.value); });
$("#key").value = store.get("wwg_key") || "";
$("#key").addEventListener("input", e => { store.set("wwg_key", e.target.value.trim()); $("#ai").hidden = !(state.sampleFn || e.target.value.trim()); });
$("#model").value = store.get("wwg_model") || "claude-sonnet-5-5";
$("#model").addEventListener("input", e => store.set("wwg_model", e.target.value.trim()));
$("#ai").addEventListener("click", aiWrite);
$("#dl").addEventListener("click", () => { const m=$("#dlMenu"); m.hidden=!m.hidden; $("#dl").setAttribute("aria-expanded", String(!m.hidden)); });
$("#dlPdf").addEventListener("click", () => downloadPaper("pdf"));
$("#dlImg").addEventListener("click", () => downloadPaper("img"));

    $("#keyWrap").hidden = true;
    try { const s = await window.claude.use("sample"); if (s) { state.sampleFn = s; $("#ai").hidden = false; } } catch(e){}
  }

(async () => {
  try {
    state.nflState = await getJSON("/state/nfl");
    wkSel.value = String(defaultWeek(state.nflState));
    let params = null; try { params = new URL(location.href).searchParams; } catch(e){}
    const lid = params && params.get("league"), w = params && +params.get("week");
    if (w) wkSel.value = String(w);
    if (lid) { $("#q").value = lid; loadLeague(lid, +wkSel.value); }
    else setStatus("Live Sleeper data connected. Enter your username or league ID.");
  } catch(e) {
    setStatus("Showing a sample league. Live Sleeper data loads in the hosted version of this app.");
  }
})();
})();
