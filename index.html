    const sw = Math.min(17, w);
    if (sw !== state.week) show(state.raw, sw, true);
    setStatus(w > 17 ? "The sample league's season ends in Week 17. Showing Week 17." : sw === 0 ? "Showing the sample league's draft edition. Enter your username or league ID to print yours." : `Showing the sample league, Week ${sw}. Enter your username or league ID to print yours.`);
    return;
  }
  if (state.leagueId && w !== state.week) loadLeague(state.leagueId, w);
}

async function resolveInput(){
  const q = $("#q").value.trim();
  const week = +wkSel.value;
  if (!q) { setStatus("Enter a Sleeper username or league ID.", true); return; }
  if (/^\d{9,}$/.test(q)) { $("#lgWrap").hidden = true; state.pickerFor = null; return loadLeague(q, week); }
  $("#lgWrap").hidden = true; state.pickerFor = null;
  $("#go").disabled = true;
  try {
    setStatus(`Looking up @${q}…`);
    const user = await getJSON(`/user/${encodeURIComponent(q)}`);
    if (!user || !user.user_id) throw new Error(`No Sleeper user named “${q}”. Check the spelling, or paste a league ID instead.`);
    const season = (state.nflState && state.nflState.season) || String(new Date().getFullYear());
    let leagues = await getJSON(`/user/${user.user_id}/leagues/nfl/${season}`) || [];
    if (!leagues.length) throw new Error(`@${q} has no ${season} NFL leagues on Sleeper.`);
    const sel = $("#lg"); sel.innerHTML = "";
    leagues.forEach(l=>sel.add(new Option(l.name, l.league_id)));
    $("#lgWrap").hidden = leagues.length < 2;
    state.pickerFor = q.toLowerCase();
    $("#go").disabled = false;
    return loadLeague(leagues[0].league_id, week);
  } catch(e) {
    setStatus(e.network ? "Couldn't reach Sleeper from this page. Inside Claude, pages can't call outside sites; open the hosted version of the app to load a live league." : e.message, true);
  } finally { $("#go").disabled = false; }
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  clearShared();
  if (state.sample && !$("#q").value.trim()) { show(state.raw, Math.min(17, +wkSel.value), true); setStatus(+wkSel.value > 17 ? "The sample league's season ends in Week 17. Showing Week 17." : +wkSel.value === 0 ? "Showing the sample league's draft edition. Enter your username or league ID to print yours." : `Showing the sample league, Week ${Math.min(17, +wkSel.value)}. Enter your username or league ID to print yours.`); return; }
  if (!$("#lgWrap").hidden && state.pickerFor && $("#q").value.trim().toLowerCase() === state.pickerFor && $("#lg").value) return loadLeague($("#lg").value, +wkSel.value);
  resolveInput();
});
wkSel.addEventListener("change", () => goWeek(+wkSel.value));
$("#paper").addEventListener("click", e => { const b = e.target.closest(".jmp"); if (b && !b.disabled) goWeek(+b.dataset.wk); });
$("#lg").addEventListener("change", () => { clearShared(); loadLeague($("#lg").value, +wkSel.value); });
$("#regen").addEventListener("click", () => {
  clearShared();
  const v = (state.variant || 0) + 1;
  if (state.sample || !state.leagueId) { show(state.raw, state.week || 3, true, v); setStatus("Rewritten. Same scores, fresh copy."); return; }
  try { localStorage.removeItem("wwg_players_v3"); } catch(e){}
  loadLeague(state.leagueId, +wkSel.value, v).then(()=>{ if (!$("#status").classList.contains("err")) setStatus(`Refreshed with the latest scores and rewritten. Week ${wkSel.value}.`); });
});
$("#share").addEventListener("click", async () => {
  if (state.sample || !state.leagueId || !state.model) return;
  const q = new URLSearchParams({league: state.leagueId, v: String(state.variant || 0), d: state.pinDate || isoDay(new Date())});
  const url = `${SITE}/w/${state.week}/?${q.toString()}`;
  const text = state.week === 0 ? `The draft edition of ${gazetteName(state.model)} is on the stands.` : `The Week ${state.week} edition of ${gazetteName(state.model)} is on the stands.`;
  if (navigator.share) {
    try { await navigator.share({title: state.week === 0 ? "Draft Edition" : `Week ${state.week} Recap`, text, url}); setStatus("Shared."); return; }
    catch(e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); setStatus("Link copied. Paste it anywhere. It opens straight to this edition."); }
  catch(e) { setStatus("Here's your link: " + url); }
});
$("#dl").addEventListener("click", () => { const m=$("#dlMenu"); m.hidden=!m.hidden; $("#dl").setAttribute("aria-expanded", String(!m.hidden)); });
$("#dlPdf").addEventListener("click", () => downloadPaper("pdf"));
$("#dlImg").addEventListener("click", () => downloadPaper("img"));

// Boot: sample edition first, then look for live context
show(sampleRaw(), 3, true, 0, "none");
wkSel.value = "3";
(async () => {
  try {
    state.nflState = await getJSON("/state/nfl");
    wkSel.value = String(defaultWeek(state.nflState));
    let params = null; try { params = new URL(location.href).searchParams; } catch(e){}
    const lid = params && params.get("league"), w = params && params.has("week") ? +params.get("week") : null;
    const v = params && Math.max(0, parseInt(params.get("v") || "0", 10) || 0), d = params && params.get("d");
    if (w != null && w >= 0 && w <= 18) wkSel.value = String(w);
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) state.pinDate = d;
    if (lid) { $("#q").value = lid; loadLeague(lid, +wkSel.value, v); }
    else setStatus("Live Sleeper data connected. Enter your username or league ID.");
  } catch(e) {
    setStatus("Showing a sample league. Live Sleeper data loads in the hosted version of this app.");
  }
})();
})();
</script>
</body></html>
